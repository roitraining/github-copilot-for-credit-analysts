<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Time-based leakage wall for Copilot prompts">
  <rect width="1600" height="900" fill="#F4F6FB"/>
  <line x1="100" y1="220" x2="1500" y2="220" stroke="#312E81" stroke-width="8"/>
  <circle cx="260" cy="220" r="16" fill="#1E2A6B"/>
  <circle cx="800" cy="220" r="16" fill="#BE185D"/>
  <circle cx="1340" cy="220" r="16" fill="#7C3AED"/>
  <text x="260" y="170" text-anchor="middle" fill="#1E2A6B" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Observation window</text>
  <text x="800" y="170" text-anchor="middle" fill="#BE185D" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Decision time</text>
  <text x="1340" y="170" text-anchor="middle" fill="#7C3AED" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Label / outcome</text>

  <rect x="788" y="250" width="24" height="300" fill="#BE185D"/>
  <text x="800" y="590" text-anchor="middle" fill="#9D174D" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">TIME WALL</text>

  <rect x="120" y="280" width="580" height="220" rx="18" fill="#ECFEFF" stroke="#0E7490" stroke-width="4"/>
  <text x="410" y="360" text-anchor="middle" fill="#155E75" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Allowed features</text>
  <text x="410" y="420" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="22">Only fields known at or before decision</text>
  <text x="410" y="465" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="22">Encode this in feature-policy.md</text>

  <rect x="900" y="280" width="580" height="220" rx="18" fill="#FDF2F8" stroke="#BE185D" stroke-width="4"/>
  <text x="1190" y="360" text-anchor="middle" fill="#9D174D" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Leakage risk</text>
  <text x="1190" y="420" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="22">Future delinquency, post-decision fields</text>
  <text x="1190" y="465" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="22">Random splits that ignore time</text>

  <rect x="140" y="660" width="1320" height="170" rx="18" fill="#1E2A6B"/>
  <text x="800" y="735" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Copilot will not invent this wall for you</text>
  <text x="800" y="790" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="22">Require: time-based split + availability policy + split-integrity tests</text>
</svg>