<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Model leakage guardrails">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5f8fb"/>
      <stop offset="100%" stop-color="#edf4f6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f3d56"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="140" y="320" width="240" height="220" rx="24" fill="#224d9a"/>
    <text x="260" y="390" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="700">Data</text>
    <text x="260" y="430" text-anchor="middle" fill="#dfe9ff" font-size="22">raw features</text>
    <text x="260" y="470" text-anchor="middle" fill="#dfe9ff" font-size="22">time-aware split</text>

    <rect x="470" y="260" width="260" height="140" rx="20" fill="#3d78b5"/>
    <text x="600" y="325" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">Feature policy</text>
    <text x="600" y="360" text-anchor="middle" fill="#dfeaff" font-size="20">approved inputs only</text>

    <rect x="470" y="500" width="260" height="140" rx="20" fill="#1d8a9e"/>
    <text x="600" y="565" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">Leakage checks</text>
    <text x="600" y="600" text-anchor="middle" fill="#d9f6f8" font-size="20">no future signal</text>

    <rect x="860" y="320" width="280" height="220" rx="24" fill="#d97742"/>
    <text x="1000" y="390" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="700">Model</text>
    <text x="1000" y="430" text-anchor="middle" fill="#fbe7d9" font-size="22">baseline pipeline</text>
    <text x="1000" y="470" text-anchor="middle" fill="#fbe7d9" font-size="22">score and calibrate</text>

    <rect x="1210" y="320" width="250" height="220" rx="24" fill="#2d7d6f"/>
    <text x="1335" y="390" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="700">Review</text>
    <text x="1335" y="430" text-anchor="middle" fill="#dff5f0" font-size="22">risk + governance</text>
    <text x="1335" y="470" text-anchor="middle" fill="#dff5f0" font-size="22">decision evidence</text>

    <path d="M380 430 H470" stroke="#2f3d56" stroke-width="10" fill="none" marker-end="url(#arrow)"/>
    <path d="M730 330 H860" stroke="#2f3d56" stroke-width="10" fill="none" marker-end="url(#arrow)"/>
    <path d="M730 570 H860" stroke="#2f3d56" stroke-width="10" fill="none" marker-end="url(#arrow)"/>
    <path d="M1140 430 H1210" stroke="#2f3d56" stroke-width="10" fill="none" marker-end="url(#arrow)"/>

    <rect x="470" y="700" width="660" height="90" rx="18" fill="#ffffff" opacity="0.9"/>
    <text x="800" y="758" text-anchor="middle" fill="#1f2937" font-size="34" font-weight="700">Good validation starts before training, not after.</text>
  </g>
</svg>
