<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Plan approve test loop">
  <rect width="1600" height="900" fill="#F4F6FB"/>
  <circle cx="400" cy="340" r="150" fill="#1E2A6B"/>
  <text x="400" y="325" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Plan</text>
  <text x="400" y="375" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="34">no edits yet</text>

  <circle cx="800" cy="340" r="150" fill="#7C3AED"/>
  <text x="800" y="325" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Approve</text>
  <text x="800" y="375" text-anchor="middle" fill="#EDE9FE" font-family="Arial, Helvetica, sans-serif" font-size="34">step N only</text>

  <circle cx="1200" cy="340" r="150" fill="#0E7490"/>
  <text x="1200" y="325" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Test</text>
  <text x="1200" y="375" text-anchor="middle" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="34">pytest evidence</text>

  <path d="M550 340 H650" stroke="#312E81" stroke-width="12" fill="none"/>
  <path d="M950 340 H1050" stroke="#312E81" stroke-width="12" fill="none"/>
  <path d="M1200 490 C1200 680 400 680 400 490" stroke="#312E81" stroke-width="10" fill="none" stroke-dasharray="16 12"/>
  <text x="800" y="700" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="36">Return for next step only if tests pass</text>

  <rect x="250" y="760" width="1100" height="90" rx="16" fill="#ffffff" stroke="#BE185D" stroke-width="3"/>
  <text x="800" y="820" text-anchor="middle" fill="#9D174D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Anti-pattern: one broad prompt that edits everything</text>
</svg>