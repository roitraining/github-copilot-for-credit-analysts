<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Copilot surfaces comparison">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5f8fd"/>
      <stop offset="100%" stop-color="#edf3f7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f3d56"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="120" y="230" width="400" height="420" rx="24" fill="#1f4b99"/>
    <text x="320" y="300" text-anchor="middle" fill="#ffffff" font-size="38" font-weight="700">GitHub.com</text>
    <text x="320" y="355" text-anchor="middle" fill="#dfe9ff" font-size="26">Product entry point</text>
    <text x="320" y="410" text-anchor="middle" fill="#dfe9ff" font-size="24">Plan and access</text>
    <text x="320" y="455" text-anchor="middle" fill="#dfe9ff" font-size="24">Rollout guidance</text>
    <text x="320" y="500" text-anchor="middle" fill="#dfe9ff" font-size="24">Docs and enablement</text>
    <text x="320" y="555" text-anchor="middle" fill="#dfe9ff" font-size="24">Good for context</text>

    <rect x="600" y="230" width="400" height="420" rx="24" fill="#3a7ea1"/>
    <text x="800" y="300" text-anchor="middle" fill="#ffffff" font-size="38" font-weight="700">VS Code</text>
    <text x="800" y="355" text-anchor="middle" fill="#dff2fb" font-size="26">Daily execution surface</text>
    <text x="800" y="410" text-anchor="middle" fill="#dff2fb" font-size="24">Inline code help</text>
    <text x="800" y="455" text-anchor="middle" fill="#dff2fb" font-size="24">Chat and edits</text>
    <text x="800" y="500" text-anchor="middle" fill="#dff2fb" font-size="24">Scoped context</text>
    <text x="800" y="555" text-anchor="middle" fill="#dff2fb" font-size="24">Review + tests</text>

    <rect x="1080" y="230" width="400" height="420" rx="24" fill="#2d7d6f"/>
    <text x="1280" y="300" text-anchor="middle" fill="#ffffff" font-size="38" font-weight="700">Agents</text>
    <text x="1280" y="355" text-anchor="middle" fill="#def5f1" font-size="26">Bounded execution</text>
    <text x="1280" y="410" text-anchor="middle" fill="#def5f1" font-size="24">Plan and approve</text>
    <text x="1280" y="455" text-anchor="middle" fill="#def5f1" font-size="24">Small batches</text>
    <text x="1280" y="500" text-anchor="middle" fill="#def5f1" font-size="24">Traceable review</text>
    <text x="1280" y="555" text-anchor="middle" fill="#def5f1" font-size="24">Safer at scale</text>

    <path d="M520 440 H600" stroke="#2f3d56" stroke-width="8" fill="none" marker-end="url(#arrow)"/>
    <path d="M1000 440 H1080" stroke="#2f3d56" stroke-width="8" fill="none" marker-end="url(#arrow)"/>

    <rect x="370" y="700" width="860" height="90" rx="18" fill="#ffffff" opacity="0.9"/>
    <text x="800" y="758" text-anchor="middle" fill="#1f2937" font-size="34" font-weight="700">Choose the surface that matches the job, not just the hype.</text>
  </g>
</svg>
