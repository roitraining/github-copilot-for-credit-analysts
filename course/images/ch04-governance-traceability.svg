<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Governance and traceability flow">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5f8fb"/>
      <stop offset="100%" stop-color="#eef4f8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f3d56"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="130" y="350" width="200" height="150" rx="22" fill="#224d9a"/>
    <text x="230" y="405" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">Prompt</text>
    <text x="230" y="447" text-anchor="middle" fill="#dfe9ff" font-size="20">intent + scope</text>

    <rect x="410" y="350" width="200" height="150" rx="22" fill="#3d78b5"/>
    <text x="510" y="405" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">Context</text>
    <text x="510" y="447" text-anchor="middle" fill="#dfeaff" font-size="20">files + policies</text>

    <rect x="690" y="350" width="200" height="150" rx="22" fill="#1d8a9e"/>
    <text x="790" y="405" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">Changes</text>
    <text x="790" y="447" text-anchor="middle" fill="#d9f6f8" font-size="20">code + docs</text>

    <rect x="970" y="350" width="200" height="150" rx="22" fill="#d97742"/>
    <text x="1070" y="405" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">Tests</text>
    <text x="1070" y="447" text-anchor="middle" fill="#fbe7d9" font-size="20">regression checks</text>

    <rect x="1250" y="350" width="220" height="150" rx="22" fill="#2d7d6f"/>
    <text x="1360" y="405" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">Evidence</text>
    <text x="1360" y="447" text-anchor="middle" fill="#dff5f0" font-size="20">review + audit trail</text>

    <path d="M330 425 H410" stroke="#2f3d56" stroke-width="10" fill="none" marker-end="url(#arrow)"/>
    <path d="M610 425 H690" stroke="#2f3d56" stroke-width="10" fill="none" marker-end="url(#arrow)"/>
    <path d="M890 425 H970" stroke="#2f3d56" stroke-width="10" fill="none" marker-end="url(#arrow)"/>
    <path d="M1170 425 H1250" stroke="#2f3d56" stroke-width="10" fill="none" marker-end="url(#arrow)"/>

    <path d="M230 500 V650 C230 690 280 710 330 710 H1270 C1315 710 1360 690 1360 650 V500" fill="none" stroke="#2f3d56" stroke-width="8" stroke-dasharray="14 14" marker-end="url(#arrow)"/>

    <rect x="500" y="620" width="600" height="120" rx="18" fill="#ffffff" opacity="0.92"/>
    <text x="800" y="675" text-anchor="middle" fill="#1f2937" font-size="34" font-weight="700">Governance is traceable, not mysterious.</text>
    <text x="800" y="712" text-anchor="middle" fill="#4b5563" font-size="22">Good teams keep the evidence chain visible and reviewable.</text>
  </g>
</svg>
