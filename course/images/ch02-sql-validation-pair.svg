<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="SQL main query and validation query pair">
  <rect width="1600" height="900" fill="#f5f7fb"/>
  <rect x="100" y="120" width="600" height="560" rx="24" fill="#1f4b99"/>
  <text x="400" y="230" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Main query</text>
  <text x="400" y="340" text-anchor="middle" fill="#dfe9ff" font-family="Arial, Helvetica, sans-serif" font-size="26">Answers the business question</text>
  <text x="400" y="420" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24">grain + denominator + joins</text>
  <text x="400" y="480" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24">metrics by segment</text>
  <text x="400" y="580" text-anchor="middle" fill="#fff3c4" font-family="Arial, Helvetica, sans-serif" font-size="22">Necessary, not sufficient</text>

  <text x="800" y="420" text-anchor="middle" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700">+</text>

  <rect x="900" y="120" width="600" height="560" rx="24" fill="#2d7d6f"/>
  <text x="1200" y="230" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Validation query</text>
  <text x="1200" y="340" text-anchor="middle" fill="#def5f1" font-family="Arial, Helvetica, sans-serif" font-size="26">Proves the answer is safe</text>
  <text x="1200" y="420" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24">duplicate grain checks</text>
  <text x="1200" y="480" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24">null rates and totals</text>
  <text x="1200" y="580" text-anchor="middle" fill="#fff3c4" font-family="Arial, Helvetica, sans-serif" font-size="22">Catches silent join bugs</text>

  <rect x="250" y="740" width="1100" height="100" rx="18" fill="#ffffff" stroke="#d97742" stroke-width="4"/>
  <text x="800" y="805" text-anchor="middle" fill="#1f2937" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Prompt contract: both queries, or the request is incomplete</text>
</svg>