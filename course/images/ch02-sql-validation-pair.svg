<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="SQL main query and validation query pair">
  <rect width="1600" height="900" fill="#F4F6FB"/>
  <rect x="100" y="120" width="600" height="560" rx="24" fill="#1E2A6B"/>
  <text x="400" y="230" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Main query</text>
  <text x="400" y="340" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="38">Answers the business question</text>
  <text x="400" y="420" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36">grain + denominator + joins</text>
  <text x="400" y="480" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36">metrics by segment</text>
  <text x="400" y="580" text-anchor="middle" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="36">Necessary, not sufficient</text>

  <text x="800" y="420" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700">+</text>

  <rect x="900" y="120" width="600" height="560" rx="24" fill="#0E7490"/>
  <text x="1200" y="230" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Validation query</text>
  <text x="1200" y="340" text-anchor="middle" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="38">Proves the answer is safe</text>
  <text x="1200" y="420" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36">duplicate grain checks</text>
  <text x="1200" y="480" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36">null rates and totals</text>
  <text x="1200" y="580" text-anchor="middle" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="36">Catches silent join bugs</text>

  <rect x="250" y="740" width="1100" height="100" rx="18" fill="#ffffff" stroke="#7C3AED" stroke-width="4"/>
  <text x="800" y="805" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">Prompt contract: both queries, or the request is incomplete</text>
</svg>