<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="Three Copilot steps to refactor, add assertions, and generate pytest suites">
  <!-- Header -->
  <rect x="40" y="35" width="720" height="85" rx="18" fill="#FFFFFF" stroke="#1E2A6B" stroke-width="4"/>
  <text x="400" y="88" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">AI-Powered Code Maintenance Loop</text>

  <!-- Step 1: Inline Chat Refactor -->
  <rect x="50" y="150" width="700" height="175" rx="20" fill="#FFFFFF" stroke="#312E81" stroke-width="3"/>
  <rect x="75" y="180" width="190" height="54" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="170" y="215" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">1. REFACTOR</text>
  <text x="290" y="205" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Inline Chat (Cmd+I / Ctrl+I)</text>
  <text x="290" y="242" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="22">Split a long script into small, typed functions</text>
  <text x="290" y="276" fill="#4338CA" font-family="Courier New, monospace" font-size="21">Vectorize slow loops with numpy/pandas</text>

  <!-- Arrow 1 -->
  <path d="M400 330 V355" stroke="#1E2A6B" stroke-width="8" fill="none"/>
  <polygon points="400,372 384,348 416,348" fill="#1E2A6B"/>

  <!-- Step 2: Defensive Assertions -->
  <rect x="50" y="380" width="700" height="175" rx="20" fill="#EEF2FF" stroke="#4F46E5" stroke-width="3"/>
  <rect x="75" y="410" width="190" height="54" rx="12" fill="#FFFFFF" stroke="#1E2A6B" stroke-width="2"/>
  <text x="170" y="445" text-anchor="middle" fill="#1E2A6B" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">2. ASSERT</text>
  <text x="290" y="435" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Inline Chat + Ghost Text</text>
  <text x="290" y="472" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="22">Add input schema and output range guards</text>
  <text x="290" y="506" fill="#92400E" font-family="Courier New, monospace" font-size="21">raise ValueError if rate not in [0, 1]</text>

  <!-- Arrow 2 -->
  <path d="M400 560 V585" stroke="#1E2A6B" stroke-width="8" fill="none"/>
  <polygon points="400,602 384,578 416,578" fill="#1E2A6B"/>

  <!-- Step 3: PyTest Suite -->
  <rect x="50" y="610" width="700" height="150" rx="20" fill="#ECFEFF" stroke="#0E7490" stroke-width="3"/>
  <rect x="75" y="638" width="190" height="54" rx="12" fill="#FFFFFF" stroke="#155E75" stroke-width="2"/>
  <text x="170" y="673" text-anchor="middle" fill="#0E7490" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">3. PYTEST</text>
  <text x="290" y="660" fill="#164E63" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Chat /tests + #file</text>
  <text x="290" y="697" fill="#155E75" font-family="Arial, Helvetica, sans-serif" font-size="22">Generate fixtures, @pytest.mark.parametrize,</text>
  <text x="290" y="728" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">and pytest.raises checks for every guard</text>
</svg>
