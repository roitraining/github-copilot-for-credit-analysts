<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="MRM evidence chain">
  <rect width="1600" height="900" fill="#F4F6FB"/>
  <rect x="40" y="120" width="280" height="400" rx="18" fill="#1E2A6B"/>
  <text x="180" y="220" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">1. Prompt</text>
  <text x="180" y="300" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="34">version / date</text>
  <text x="180" y="350" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="34">context files</text>
  <text x="180" y="430" text-anchor="middle" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="34">Intent</text>

  <rect x="360" y="120" width="280" height="400" rx="18" fill="#4F46E5"/>
  <text x="500" y="220" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">2. Diff</text>
  <text x="500" y="300" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="34">files changed</text>
  <text x="500" y="350" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="34">scope vs plan</text>
  <text x="500" y="430" text-anchor="middle" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="34">Change</text>

  <rect x="680" y="120" width="280" height="400" rx="18" fill="#7C3AED"/>
  <text x="820" y="220" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">3. Tests</text>
  <text x="820" y="300" text-anchor="middle" fill="#EDE9FE" font-family="Arial, Helvetica, sans-serif" font-size="34">pytest command</text>
  <text x="820" y="350" text-anchor="middle" fill="#EDE9FE" font-family="Arial, Helvetica, sans-serif" font-size="34">benchmarks</text>
  <text x="820" y="430" text-anchor="middle" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="34">Proof</text>

  <rect x="1000" y="120" width="280" height="400" rx="18" fill="#0E7490"/>
  <text x="1140" y="220" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">4. Decision</text>
  <text x="1140" y="300" text-anchor="middle" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="34">risk rating</text>
  <text x="1140" y="350" text-anchor="middle" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="34">residual risks</text>
  <text x="1140" y="430" text-anchor="middle" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="34">Go / no-go</text>

  <rect x="1320" y="120" width="220" height="400" rx="18" fill="#312E81"/>
  <text x="1430" y="280" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Model</text>
  <text x="1430" y="330" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">card</text>
  <text x="1430" y="430" text-anchor="middle" fill="#C7D2FE" font-family="Arial, Helvetica, sans-serif" font-size="34">packaged</text>

  <path d="M320 320 H360" stroke="#312E81" stroke-width="8" fill="none"/>
  <path d="M640 320 H680" stroke="#312E81" stroke-width="8" fill="none"/>
  <path d="M960 320 H1000" stroke="#312E81" stroke-width="8" fill="none"/>
  <path d="M1280 320 H1320" stroke="#312E81" stroke-width="8" fill="none"/>

  <rect x="160" y="600" width="1280" height="220" rx="18" fill="#ffffff" stroke="#1E2A6B" stroke-width="4"/>
  <text x="800" y="690" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">Break any link and auditors cannot reconstruct what happened</text>
  <text x="800" y="760" text-anchor="middle" fill="#4C4668" font-family="Arial, Helvetica, sans-serif" font-size="36">Copilot can draft the package - humans must verify the numbers</text>
</svg>