<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Three-step workflow to translate SAS to Python with Copilot">
  <rect width="1600" height="900" fill="#F4F6FB"/>

  <rect x="60" y="50" width="440" height="630" rx="26" fill="#1E2A6B"/>
  <text x="280" y="135" text-anchor="middle" fill="#A5B4FC" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">STEP 1</text>
  <text x="280" y="205" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">/explain First</text>
  <rect x="95" y="255" width="370" height="170" rx="16" fill="#151C4A"/>
  <text x="280" y="315" text-anchor="middle" fill="#C7D2FE" font-family="Courier New, monospace" font-size="26">#file roll_rate.sas</text>
  <text x="280" y="365" text-anchor="middle" fill="#FFFFFF" font-family="Courier New, monospace" font-size="28">/explain</text>
  <text x="280" y="495" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="30">Ask what the SAS block</text>
  <text x="280" y="540" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="30">does before writing code</text>
  <text x="280" y="615" text-anchor="middle" fill="#FDE68A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Spots WHERE vs IF rules</text>

  <path d="M515 365 H565" stroke="#312E81" stroke-width="10" fill="none"/>
  <polygon points="585,365 555,345 555,385" fill="#312E81"/>

  <rect x="595" y="50" width="440" height="630" rx="26" fill="#4F46E5"/>
  <text x="815" y="135" text-anchor="middle" fill="#C4B5FD" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">STEP 2</text>
  <text x="815" y="205" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">Convert One Block</text>
  <rect x="630" y="255" width="370" height="170" rx="16" fill="#3730A3"/>
  <text x="815" y="315" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="28">One DATA step or</text>
  <text x="815" y="365" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">one PROC SQL block</text>
  <text x="815" y="495" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="30">Name target library:</text>
  <text x="815" y="540" text-anchor="middle" fill="#FFFFFF" font-family="Courier New, monospace" font-size="30">pandas or PySpark</text>
  <text x="815" y="615" text-anchor="middle" fill="#FDE68A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">State how nulls behave</text>

  <path d="M1050 365 H1100" stroke="#312E81" stroke-width="10" fill="none"/>
  <polygon points="1120,365 1090,345 1090,385" fill="#312E81"/>

  <rect x="1130" y="50" width="410" height="630" rx="26" fill="#0E7490"/>
  <text x="1335" y="135" text-anchor="middle" fill="#A5F3FC" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">STEP 3</text>
  <text x="1335" y="205" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">/tests for Parity</text>
  <rect x="1165" y="255" width="340" height="170" rx="16" fill="#155E75"/>
  <text x="1335" y="315" text-anchor="middle" fill="#CFFAFE" font-family="Courier New, monospace" font-size="28">/tests</text>
  <text x="1335" y="365" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28">5 synthetic rows</text>
  <text x="1335" y="495" text-anchor="middle" fill="#ECFEFF" font-family="Arial, Helvetica, sans-serif" font-size="30">Test missing values</text>
  <text x="1335" y="540" text-anchor="middle" fill="#ECFEFF" font-family="Arial, Helvetica, sans-serif" font-size="30">and boundary cutoffs</text>
  <text x="1335" y="615" text-anchor="middle" fill="#6EE7B7" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Confirm outputs match</text>

  <rect x="60" y="725" width="1480" height="120" rx="18" fill="#FFFFFF" stroke="#1E2A6B" stroke-width="4"/>
  <text x="800" y="798" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Never paste a 500-line SAS file and ask Copilot to rewrite the whole program at once</text>
</svg>
