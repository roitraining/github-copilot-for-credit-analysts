<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Model validation pipeline">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#F4F6FB"/>
      <stop offset="100%" stop-color="#EEF1F8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#312E81"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="120" y="370" width="220" height="150" rx="22" fill="#1E2A6B"/>
    <text x="230" y="420" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="700">Train</text>
    <text x="230" y="470" text-anchor="middle" fill="#E0E7FF" font-size="20">split + features</text>

    <rect x="430" y="370" width="220" height="150" rx="22" fill="#4F46E5"/>
    <text x="540" y="420" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="700">Model</text>
    <text x="540" y="470" text-anchor="middle" fill="#E0E7FF" font-size="20">baseline + tuning</text>

    <rect x="740" y="370" width="220" height="150" rx="22" fill="#6366F1"/>
    <text x="850" y="420" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="700">Validate</text>
    <text x="850" y="470" text-anchor="middle" fill="#CFFAFE" font-size="20">KS + AUC</text>

    <rect x="1050" y="370" width="220" height="150" rx="22" fill="#7C3AED"/>
    <text x="1160" y="420" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="700">Explain</text>
    <text x="1160" y="470" text-anchor="middle" fill="#EDE9FE" font-size="20">segment risk</text>

    <rect x="1360" y="370" width="180" height="150" rx="22" fill="#0E7490"/>
    <text x="1450" y="420" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="700">Approve</text>
    <text x="1450" y="470" text-anchor="middle" fill="#CFFAFE" font-size="20">governance</text>

    <path d="M340 445 H430" stroke="#312E81" stroke-width="10" fill="none" marker-end="url(#arrow)"/>
    <path d="M650 445 H740" stroke="#312E81" stroke-width="10" fill="none" marker-end="url(#arrow)"/>
    <path d="M960 445 H1050" stroke="#312E81" stroke-width="10" fill="none" marker-end="url(#arrow)"/>
    <path d="M1270 445 H1360" stroke="#312E81" stroke-width="10" fill="none" marker-end="url(#arrow)"/>

    <path d="M230 520 V620 H1370 V520" fill="none" stroke="#312E81" stroke-width="8" stroke-dasharray="14 14" marker-end="url(#arrow)"/>

    <rect x="470" y="610" width="660" height="130" rx="18" fill="#ffffff" opacity="0.9"/>
    <text x="800" y="665" text-anchor="middle" fill="#1E1B4B" font-size="34" font-weight="700">Validation is a controlled discipline, not a single score.</text>
    <text x="800" y="705" text-anchor="middle" fill="#4C4668" font-size="22">The important checks are stability, calibration, and governance fit.</text>
  </g>
</svg>
