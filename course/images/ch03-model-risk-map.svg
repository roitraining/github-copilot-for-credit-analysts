<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Model risk map">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5f8fb"/>
      <stop offset="100%" stop-color="#edf4f6"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="200" y="220" width="350" height="180" rx="22" fill="#224d9a"/>
    <text x="375" y="290" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="700">Statistical</text>
    <text x="375" y="340" text-anchor="middle" fill="#dfe9ff" font-size="22">AUC, KS, PR AUC</text>

    <rect x="625" y="220" width="350" height="180" rx="22" fill="#3d78b5"/>
    <text x="800" y="290" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="700">Stability</text>
    <text x="800" y="340" text-anchor="middle" fill="#dfeaff" font-size="22">segment drift + time shifts</text>

    <rect x="1050" y="220" width="350" height="180" rx="22" fill="#1d8a9e"/>
    <text x="1225" y="290" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="700">Operational</text>
    <text x="1225" y="340" text-anchor="middle" fill="#d9f6f8" font-size="22">runtime, schema, failures</text>

    <rect x="430" y="500" width="740" height="150" rx="24" fill="#ffffff" opacity="0.9"/>
    <text x="800" y="560" text-anchor="middle" fill="#1f2937" font-size="34" font-weight="700">One score is never the whole risk story.</text>
    <text x="800" y="610" text-anchor="middle" fill="#4b5563" font-size="24">Finance teams need statistical, operational, and governance checks.</text>
  </g>
</svg>
