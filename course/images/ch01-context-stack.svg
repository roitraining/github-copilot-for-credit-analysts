<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Context stack for AI delivery">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#eef5f7"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="260" y="120" width="1080" height="110" rx="20" fill="#224d9a"/>
    <text x="800" y="185" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="700">Business goal and policy</text>

    <rect x="330" y="260" width="940" height="110" rx="20" fill="#3d78b5"/>
    <text x="800" y="325" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="700">Files, schemas, metrics, and constraints</text>

    <rect x="400" y="400" width="800" height="110" rx="20" fill="#1d8a9e"/>
    <text x="800" y="465" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="700">Targeted prompt and acceptance criteria</text>

    <rect x="470" y="540" width="660" height="110" rx="20" fill="#d97742"/>
    <text x="800" y="605" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="700">Test, review, and approval loop</text>

    <text x="800" y="760" text-anchor="middle" fill="#1f2937" font-size="34" font-weight="700">Better context beats a bigger prompt.</text>
  </g>
</svg>
