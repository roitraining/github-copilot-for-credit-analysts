<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="What Copilot context layers include">
  <rect width="1600" height="900" fill="#F4F6FB"/>
  <polygon points="800,80 1320,260 280,260" fill="#A5B4FC"/>
  <text x="800" y="200" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Process: instructions, tests, review rules</text>
  <polygon points="800,260 1220,440 380,440" fill="#4F46E5"/>
  <text x="800" y="380" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Domain: schema dictionary, metric defs, policy</text>
  <polygon points="800,440 1120,620 480,620" fill="#1E2A6B"/>
  <text x="800" y="560" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Code: #selection, #file, nearby modules</text>
  <rect x="520" y="660" width="560" height="120" rx="16" fill="#0E7490"/>
  <text x="800" y="735" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Business goal (you supply this)</text>
  <text x="800" y="850" text-anchor="middle" fill="#4C4668" font-family="Arial, Helvetica, sans-serif" font-size="22">Higher layers only help if lower layers are attached and consistent</text>
</svg>