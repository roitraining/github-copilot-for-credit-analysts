<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Four parts of a Copilot chart prompt">
  <!-- Card 1: Library -->
  <rect x="60" y="50" width="340" height="630" rx="24" fill="#FFFFFF" stroke="#312E81" stroke-width="4"/>
  <text x="230" y="135" text-anchor="middle" fill="#4338CA" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">1. LIBRARY</text>
  <text x="230" y="205" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">Name the Tool</text>
  <rect x="90" y="260" width="280" height="210" rx="16" fill="#EEF2FF" stroke="#312E81" stroke-width="3"/>
  <text x="230" y="345" text-anchor="middle" fill="#1E1B4B" font-family="Courier New, monospace" font-size="30">seaborn</text>
  <text x="230" y="405" text-anchor="middle" fill="#1E1B4B" font-family="Courier New, monospace" font-size="30">matplotlib</text>
  <text x="230" y="545" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="28">Stops Copilot from</text>
  <text x="230" y="590" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="28">mixing plotting APIs</text>

  <!-- Card 2: Chart Type -->
  <rect x="440" y="50" width="340" height="630" rx="24" fill="#EEF2FF" stroke="#4F46E5" stroke-width="4"/>
  <text x="610" y="135" text-anchor="middle" fill="#4338CA" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">2. CHART TYPE</text>
  <text x="610" y="205" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">Pick the Shape</text>
  <rect x="470" y="260" width="280" height="210" rx="16" fill="#FFFFFF" stroke="#4F46E5" stroke-width="3"/>
  <text x="610" y="325" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="28">Line plot</text>
  <text x="610" y="375" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="28">Boxplot</text>
  <text x="610" y="425" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="28">Cohort heatmap</text>
  <text x="610" y="545" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="28">Be specific about</text>
  <text x="610" y="590" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="28">subplots or panels</text>

  <!-- Card 3: Exact Columns -->
  <rect x="820" y="50" width="340" height="630" rx="24" fill="#ECFEFF" stroke="#0E7490" stroke-width="4"/>
  <text x="990" y="135" text-anchor="middle" fill="#0E7490" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">3. COLUMNS</text>
  <text x="990" y="205" text-anchor="middle" fill="#164E63" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">Map the Axes</text>
  <rect x="850" y="260" width="280" height="210" rx="16" fill="#FFFFFF" stroke="#0E7490" stroke-width="3"/>
  <text x="990" y="325" text-anchor="middle" fill="#164E63" font-family="Courier New, monospace" font-size="26">x = "month"</text>
  <text x="990" y="375" text-anchor="middle" fill="#164E63" font-family="Courier New, monospace" font-size="26">y = "dlq_rate"</text>
  <text x="990" y="425" text-anchor="middle" fill="#164E63" font-family="Courier New, monospace" font-size="26">hue = "risk_band"</text>
  <text x="990" y="545" text-anchor="middle" fill="#155E75" font-family="Arial, Helvetica, sans-serif" font-size="28">Name exact columns</text>
  <text x="990" y="590" text-anchor="middle" fill="#155E75" font-family="Arial, Helvetica, sans-serif" font-size="28">from your DataFrame</text>

  <!-- Card 4: Output & Layout -->
  <rect x="1200" y="50" width="340" height="630" rx="24" fill="#F0FDFA" stroke="#0F766E" stroke-width="4"/>
  <text x="1370" y="135" text-anchor="middle" fill="#0F766E" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">4. OUTPUT</text>
  <text x="1370" y="205" text-anchor="middle" fill="#134E4A" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">Set the Finish</text>
  <rect x="1230" y="260" width="280" height="210" rx="16" fill="#FFFFFF" stroke="#0F766E" stroke-width="3"/>
  <text x="1370" y="325" text-anchor="middle" fill="#134E4A" font-family="Arial, Helvetica, sans-serif" font-size="28">Title and labels</text>
  <text x="1370" y="375" text-anchor="middle" fill="#134E4A" font-family="Arial, Helvetica, sans-serif" font-size="28">Reference line</text>
  <text x="1370" y="425" text-anchor="middle" fill="#134E4A" font-family="Courier New, monospace" font-size="25">savefig("out.png")</text>
  <text x="1370" y="545" text-anchor="middle" fill="#115E59" font-family="Arial, Helvetica, sans-serif" font-size="28">Tell it whether to</text>
  <text x="1370" y="590" text-anchor="middle" fill="#115E59" font-family="Arial, Helvetica, sans-serif" font-size="28">save or show</text>

  <!-- Footer example bar -->
  <rect x="60" y="725" width="1480" height="120" rx="18" fill="#FFFFFF" stroke="#1E2A6B" stroke-width="4"/>
  <text x="800" y="798" text-anchor="middle" fill="#1E2A6B" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Specify all four in Chat, then use Inline Chat for small tweaks</text>
</svg>
