  <rect width="800" height="800" fill="#F4F6FB"/>

  <!-- Editor Window Frame -->
  <rect x="40" y="40" width="720" height="720" rx="24" fill="#1E1B4B"/>
  <rect x="40" y="40" width="720" height="64" rx="24" fill="#312E81"/>
  <circle cx="85" cy="72" r="10" fill="#F87171"/>
  <circle cx="120" cy="72" r="10" fill="#FBBF24"/>
  <circle cx="155" cy="72" r="10" fill="#34D399"/>
  <text x="400" y="80" text-anchor="middle" fill="#E0E7FF" font-family="Courier New, monospace" font-size="24" font-weight="700">plot_trends.py</text>

  <!-- Unchanged top code -->
  <text x="75" y="155" fill="#94A3B8" font-family="Courier New, monospace" font-size="22">df = pd.read_csv("sample_accounts.csv")</text>
  <text x="75" y="190" fill="#94A3B8" font-family="Courier New, monospace" font-size="22">fig, ax = plt.subplots(figsize=(8, 5))</text>

