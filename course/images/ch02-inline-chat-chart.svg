  <!-- Unchanged top code -->
  <text x="75" y="155" fill="#475569" font-family="Courier New, monospace" font-size="22">df = pd.read_csv("sample_accounts.csv")</text>
  <text x="75" y="190" fill="#475569" font-family="Courier New, monospace" font-size="22">fig, ax = plt.subplots(figsize=(8, 5))</text>

