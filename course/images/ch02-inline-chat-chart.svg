  <text x="75" y="260" fill="#FFFFFF" font-family="Courier New, monospace" font-size="22">sns.lineplot(data=df, x="month",</text>
  <text x="75" y="295" fill="#FFFFFF" font-family="Courier New, monospace" font-size="22">             y="dlq_rate", hue="risk_band",</text>
  <text x="75" y="330" fill="#FFFFFF" font-family="Courier New, monospace" font-size="22">             ax=ax)</text>
