  <text x="75" y="295" fill="#1E1B4B" font-family="Courier New, monospace" font-size="22">             y="dlq_rate", hue="risk_band",</text>
  <text x="75" y="330" fill="#1E1B4B" font-family="Courier New, monospace" font-size="22">             ax=ax)</text>
