  <text x="110" y="470" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">2. Press Cmd+I (Mac) or Ctrl+I (Windows)</text>
  <rect x="105" y="490" width="590" height="95" rx="10" fill="#155E75"/>
