<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Time-based split versus random split">
  <rect width="1600" height="900" fill="#F4F6FB"/>

  <text x="80" y="120" fill="#155E75" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">Time-based split</text>
  <rect x="80" y="160" width="620" height="200" rx="16" fill="#0E7490"/>
  <text x="390" y="275" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Train: Jan-Apr</text>
  <rect x="740" y="160" width="360" height="200" rx="16" fill="#4F46E5"/>
  <text x="920" y="275" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">Validate: May-Jun</text>
  <rect x="1140" y="160" width="380" height="200" rx="16" fill="#7C3AED"/>
  <text x="1330" y="275" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">Holdout: Jul-Aug</text>
  <text x="800" y="420" text-anchor="middle" fill="#155E75" font-family="Arial, Helvetica, sans-serif" font-size="36">Later months never enter training</text>

  <text x="80" y="520" fill="#9D174D" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">Random split</text>
  <rect x="80" y="560" width="200" height="140" rx="12" fill="#7C3AED"/>
  <rect x="300" y="560" width="200" height="140" rx="12" fill="#0E7490"/>
  <rect x="520" y="560" width="200" height="140" rx="12" fill="#4F46E5"/>
  <rect x="740" y="560" width="200" height="140" rx="12" fill="#0E7490"/>
  <rect x="960" y="560" width="200" height="140" rx="12" fill="#7C3AED"/>
  <rect x="1180" y="560" width="200" height="140" rx="12" fill="#4F46E5"/>
  <rect x="1400" y="560" width="120" height="140" rx="12" fill="#0E7490"/>
  <text x="180" y="640" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Jul</text>
  <text x="400" y="640" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Feb</text>
  <text x="620" y="640" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">May</text>
  <text x="840" y="640" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Jan</text>
  <text x="1060" y="640" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Aug</text>
  <text x="1280" y="640" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Jun</text>
  <text x="1460" y="640" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Mar</text>

  <text x="800" y="780" text-anchor="middle" fill="#9D174D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">A July default can land in the training fold</text>
  <text x="800" y="840" text-anchor="middle" fill="#4C4668" font-family="Arial, Helvetica, sans-serif" font-size="36">Green = train, blue = validate, orange = holdout. Random assignment ignores time.</text>
</svg>
