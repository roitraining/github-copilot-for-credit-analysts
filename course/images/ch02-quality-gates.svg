<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Three quality gates for analytics code">
  <rect width="1600" height="900" fill="#f5f7fb"/>
  <rect x="80" y="100" width="440" height="580" rx="24" fill="#1f4b99"/>
  <circle cx="300" cy="220" r="48" fill="#ffffff"/>
  <text x="300" y="235" text-anchor="middle" fill="#1f4b99" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">1</text>
  <text x="300" y="340" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Static</text>
  <text x="300" y="420" text-anchor="middle" fill="#dfe9ff" font-family="Arial, Helvetica, sans-serif" font-size="24">lint, types,</text>
  <text x="300" y="470" text-anchor="middle" fill="#dfe9ff" font-family="Arial, Helvetica, sans-serif" font-size="24">imports, style</text>
  <text x="300" y="580" text-anchor="middle" fill="#fff3c4" font-family="Arial, Helvetica, sans-serif" font-size="24">Fast fail</text>

  <rect x="580" y="100" width="440" height="580" rx="24" fill="#3a7ea1"/>
  <circle cx="800" cy="220" r="48" fill="#ffffff"/>
  <text x="800" y="235" text-anchor="middle" fill="#3a7ea1" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">2</text>
  <text x="800" y="340" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Logic</text>
  <text x="800" y="420" text-anchor="middle" fill="#dff2fb" font-family="Arial, Helvetica, sans-serif" font-size="24">unit tests,</text>
  <text x="800" y="470" text-anchor="middle" fill="#dff2fb" font-family="Arial, Helvetica, sans-serif" font-size="24">edge cases</text>
  <text x="800" y="580" text-anchor="middle" fill="#fff3c4" font-family="Arial, Helvetica, sans-serif" font-size="24">Behavior proof</text>

  <rect x="1080" y="100" width="440" height="580" rx="24" fill="#2d7d6f"/>
  <circle cx="1300" cy="220" r="48" fill="#ffffff"/>
  <text x="1300" y="235" text-anchor="middle" fill="#2d7d6f" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">3</text>
  <text x="1300" y="340" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Business</text>
  <text x="1300" y="420" text-anchor="middle" fill="#def5f1" font-family="Arial, Helvetica, sans-serif" font-size="24">benchmarks,</text>
  <text x="1300" y="470" text-anchor="middle" fill="#def5f1" font-family="Arial, Helvetica, sans-serif" font-size="24">segment sense</text>
  <text x="1300" y="580" text-anchor="middle" fill="#fff3c4" font-family="Arial, Helvetica, sans-serif" font-size="24">Analyst sign-off</text>

  <text x="800" y="800" text-anchor="middle" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="26">Copilot can help at every gate - humans still own Gate 3</text>
</svg>