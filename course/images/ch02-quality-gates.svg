<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Three quality gates for analytics code">
  <rect width="1600" height="900" fill="#F4F6FB"/>
  <rect x="80" y="100" width="440" height="580" rx="24" fill="#1E2A6B"/>
  <circle cx="300" cy="220" r="48" fill="#ffffff"/>
  <text x="300" y="235" text-anchor="middle" fill="#1E2A6B" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">1</text>
  <text x="300" y="340" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Static</text>
  <text x="300" y="420" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="36">lint, types,</text>
  <text x="300" y="470" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="36">imports, style</text>
  <text x="300" y="580" text-anchor="middle" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="36">Fast fail</text>

  <rect x="580" y="100" width="440" height="580" rx="24" fill="#4F46E5"/>
  <circle cx="800" cy="220" r="48" fill="#ffffff"/>
  <text x="800" y="235" text-anchor="middle" fill="#4F46E5" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">2</text>
  <text x="800" y="340" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Logic</text>
  <text x="800" y="420" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="36">unit tests,</text>
  <text x="800" y="470" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="36">edge cases</text>
  <text x="800" y="580" text-anchor="middle" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="36">Behavior proof</text>

  <rect x="1080" y="100" width="440" height="580" rx="24" fill="#0E7490"/>
  <circle cx="1300" cy="220" r="48" fill="#ffffff"/>
  <text x="1300" y="235" text-anchor="middle" fill="#0E7490" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">3</text>
  <text x="1300" y="340" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Business</text>
  <text x="1300" y="420" text-anchor="middle" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="36">benchmarks,</text>
  <text x="1300" y="470" text-anchor="middle" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="36">segment sense</text>
  <text x="1300" y="580" text-anchor="middle" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="36">Analyst sign-off</text>

  <text x="800" y="800" text-anchor="middle" fill="#4C4668" font-family="Arial, Helvetica, sans-serif" font-size="38">Copilot can help at every gate - humans still own Gate 3</text>
</svg>