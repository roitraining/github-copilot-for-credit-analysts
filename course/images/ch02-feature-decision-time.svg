<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Feature availability at decision time">
  <rect width="1600" height="900" fill="#f5f7fb"/>
  <line x1="140" y1="360" x2="1460" y2="360" stroke="#334155" stroke-width="10"/>
  <polygon points="1480,360 1435,335 1435,385" fill="#334155"/>

  <rect x="160" y="180" width="480" height="150" rx="16" fill="#2d7d6f"/>
  <text x="400" y="250" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Known at decision</text>
  <text x="400" y="300" text-anchor="middle" fill="#def5f1" font-family="Arial, Helvetica, sans-serif" font-size="20">OK to engineer (if policy allows)</text>

  <rect x="768" y="120" width="28" height="360" fill="#b91c1c"/>
  <text x="782" y="100" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">DECISION</text>

  <rect x="960" y="180" width="480" height="150" rx="16" fill="#b91c1c"/>
  <text x="1200" y="250" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">After decision</text>
  <text x="1200" y="300" text-anchor="middle" fill="#fee2e2" font-family="Arial, Helvetica, sans-serif" font-size="20">Do not use as model inputs</text>

  <text x="400" y="480" text-anchor="middle" fill="#216358" font-family="Arial, Helvetica, sans-serif" font-size="24">open_date, balance_at_app, ...</text>
  <text x="1200" y="480" text-anchor="middle" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="24">post-default recovery, future DPD, ...</text>

  <rect x="220" y="580" width="1160" height="220" rx="20" fill="#ffffff" stroke="#1f4b99" stroke-width="4"/>
  <text x="800" y="670" text-anchor="middle" fill="#1f2937" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Put the wall in the prompt</text>
  <text x="800" y="740" text-anchor="middle" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="24">"Only use columns available at application_date. List any rejected fields."</text>
</svg>