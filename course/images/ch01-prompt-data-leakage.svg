<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="A prompt that contains customer data is sent to the model">
  <rect width="1600" height="900" fill="#F4F6FB"/>

  <rect x="70" y="70" width="380" height="250" rx="22" fill="#1E2A6B"/>
  <text x="260" y="160" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">1. You type it</text>
  <text x="260" y="220" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="36">The prompt is plain text</text>
  <text x="260" y="265" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="36">in the chat box</text>

  <path d="M460 195 H530" stroke="#312E81" stroke-width="10" fill="none"/>
  <polygon points="555,195 525,175 525,215" fill="#312E81"/>

  <rect x="570" y="70" width="440" height="250" rx="22" fill="#BE185D"/>
  <text x="790" y="155" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">2. Copilot sends it</text>
  <text x="790" y="215" text-anchor="middle" fill="#FCE7F3" font-family="Arial, Helvetica, sans-serif" font-size="36">The text leaves your laptop</text>
  <text x="790" y="260" text-anchor="middle" fill="#FCE7F3" font-family="Arial, Helvetica, sans-serif" font-size="36">and goes to the model</text>

  <path d="M1020 195 H1090" stroke="#312E81" stroke-width="10" fill="none"/>
  <polygon points="1115,195 1085,175 1085,215" fill="#312E81"/>

  <rect x="1130" y="70" width="400" height="250" rx="22" fill="#312E81"/>
  <text x="1330" y="155" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">3. It is stored</text>
  <text x="1330" y="215" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="36">with the chat, outside</text>
  <text x="1330" y="260" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="36">your files</text>

  <rect x="70" y="380" width="700" height="340" rx="22" fill="#FDF2F8" stroke="#BE185D" stroke-width="6"/>
  <text x="420" y="450" text-anchor="middle" fill="#9D174D" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">This leaks</text>
  <text x="420" y="520" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="38">The account extract</text>
  <text x="420" y="575" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="38">Names, account IDs, SSNs</text>
  <text x="420" y="630" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="38">The live cutoff or strategy</text>

  <rect x="830" y="380" width="700" height="340" rx="22" fill="#ECFEFF" stroke="#0E7490" stroke-width="6"/>
  <text x="1180" y="450" text-anchor="middle" fill="#155E75" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">This does not</text>
  <text x="1180" y="520" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="38">Column names only</text>
  <text x="1180" y="575" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="38">A few rows you invented</text>
  <text x="1180" y="630" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="38">The rule, cutoff as a parameter</text>

  <rect x="70" y="760" width="1460" height="90" rx="16" fill="#1E1B4B"/>
  <text x="800" y="816" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">If you would not email it outside the company, do not paste it into Copilot.</text>
</svg>
