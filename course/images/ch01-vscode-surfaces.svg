<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Inline, Chat, and Agent in VS Code">
  <rect x="40" y="40" width="490" height="820" rx="28" fill="#FFFFFF" stroke="#1E2A6B" stroke-width="4"/>
  <text x="285" y="150" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700">Inline</text>
  <text x="285" y="220" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="32">Ghost text in the editor</text>
  <rect x="80" y="280" width="410" height="200" rx="18" fill="#EEF2FF" stroke="#1E2A6B" stroke-width="3"/>
  <text x="285" y="355" text-anchor="middle" fill="#4338CA" font-family="Arial, Helvetica, sans-serif" font-size="28">Best for</text>
  <text x="285" y="420" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="36">edits you understand</text>
  <text x="285" y="560" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="36">Accept with Tab</text>
  <text x="285" y="630" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="36">Reject with Esc</text>
  <text x="285" y="760" text-anchor="middle" fill="#1E2A6B" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Stays in one file</text>

  <rect x="555" y="40" width="490" height="820" rx="28" fill="#EEF2FF" stroke="#4F46E5" stroke-width="4"/>
  <text x="800" y="150" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700">Chat</text>
  <text x="800" y="220" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="32">Questions and commands</text>
  <rect x="595" y="280" width="410" height="200" rx="18" fill="#FFFFFF" stroke="#4F46E5" stroke-width="3"/>
  <text x="800" y="340" text-anchor="middle" fill="#4338CA" font-family="Arial, Helvetica, sans-serif" font-size="28">Best for</text>
  <text x="800" y="395" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="34">a draft you describe</text>
  <text x="800" y="445" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="32">/explain /tests /fix</text>
  <text x="800" y="560" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="36">Name the files</text>
  <text x="800" y="630" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="36">Only those files</text>
  <text x="800" y="760" text-anchor="middle" fill="#4338CA" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Where you ask</text>

  <rect x="1070" y="40" width="490" height="820" rx="28" fill="#ECFEFF" stroke="#0E7490" stroke-width="4"/>
  <text x="1315" y="150" text-anchor="middle" fill="#164E63" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700">Agent</text>
  <text x="1315" y="220" text-anchor="middle" fill="#155E75" font-family="Arial, Helvetica, sans-serif" font-size="32">You approve each step</text>
  <rect x="1110" y="280" width="410" height="200" rx="18" fill="#FFFFFF" stroke="#0E7490" stroke-width="3"/>
  <text x="1315" y="355" text-anchor="middle" fill="#0E7490" font-family="Arial, Helvetica, sans-serif" font-size="28">Best for</text>
  <text x="1315" y="420" text-anchor="middle" fill="#164E63" font-family="Arial, Helvetica, sans-serif" font-size="36">changes across files</text>
  <text x="1315" y="560" text-anchor="middle" fill="#155E75" font-family="Arial, Helvetica, sans-serif" font-size="36">Approve each batch</text>
  <text x="1315" y="630" text-anchor="middle" fill="#155E75" font-family="Arial, Helvetica, sans-serif" font-size="36">Require tests</text>
  <text x="1315" y="760" text-anchor="middle" fill="#0E7490" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Check every step</text>
</svg>
