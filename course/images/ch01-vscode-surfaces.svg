<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Inline, Chat, and Agent in VS Code">
  <rect width="1600" height="900" fill="#F4F6FB"/>

  <rect x="40" y="40" width="490" height="820" rx="28" fill="#1E2A6B"/>
  <text x="285" y="150" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700">Inline</text>
  <text x="285" y="220" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="32">Ghost text in the editor</text>
  <rect x="80" y="280" width="410" height="200" rx="18" fill="#151C4A"/>
  <text x="285" y="355" text-anchor="middle" fill="#C7D2FE" font-family="Arial, Helvetica, sans-serif" font-size="28">Best for</text>
  <text x="285" y="420" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36">edits you understand</text>
  <text x="285" y="560" text-anchor="middle" fill="#DDD6FE" font-family="Arial, Helvetica, sans-serif" font-size="36">Accept with Tab</text>
  <text x="285" y="630" text-anchor="middle" fill="#DDD6FE" font-family="Arial, Helvetica, sans-serif" font-size="36">Reject with Esc</text>
  <text x="285" y="760" text-anchor="middle" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Stays in one file</text>

  <rect x="555" y="40" width="490" height="820" rx="28" fill="#4F46E5"/>
  <text x="800" y="150" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700">Chat</text>
  <text x="800" y="220" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="32">Questions and commands</text>
  <rect x="595" y="280" width="410" height="200" rx="18" fill="#3730A3"/>
  <text x="800" y="340" text-anchor="middle" fill="#C4B5FD" font-family="Arial, Helvetica, sans-serif" font-size="28">Best for</text>
  <text x="800" y="395" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34">a draft you describe</text>
  <text x="800" y="445" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32">/explain /tests /fix</text>
  <text x="800" y="560" text-anchor="middle" fill="#DDD6FE" font-family="Arial, Helvetica, sans-serif" font-size="36">Name the files</text>
  <text x="800" y="630" text-anchor="middle" fill="#DDD6FE" font-family="Arial, Helvetica, sans-serif" font-size="36">Only those files</text>
  <text x="800" y="760" text-anchor="middle" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Where you ask</text>

  <rect x="1070" y="40" width="490" height="820" rx="28" fill="#0E7490"/>
  <text x="1315" y="150" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700">Agent</text>
  <text x="1315" y="220" text-anchor="middle" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="32">You approve each step</text>
  <rect x="1110" y="280" width="410" height="200" rx="18" fill="#155E75"/>
  <text x="1315" y="355" text-anchor="middle" fill="#67E8F9" font-family="Arial, Helvetica, sans-serif" font-size="28">Best for</text>
  <text x="1315" y="420" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36">changes across files</text>
  <text x="1315" y="560" text-anchor="middle" fill="#A5F3FC" font-family="Arial, Helvetica, sans-serif" font-size="36">Approve each batch</text>
  <text x="1315" y="630" text-anchor="middle" fill="#A5F3FC" font-family="Arial, Helvetica, sans-serif" font-size="36">Require tests</text>
  <text x="1315" y="760" text-anchor="middle" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Check every step</text>
</svg>
