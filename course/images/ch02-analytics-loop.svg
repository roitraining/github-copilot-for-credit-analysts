<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Analytics workflow loop">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7f9fd"/>
      <stop offset="100%" stop-color="#edf4f7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f3d56"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="260" cy="450" r="120" fill="#244d9a"/>
    <text x="260" y="435" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="700">Question</text>
    <text x="260" y="475" text-anchor="middle" fill="#dfe9ff" font-size="18">business need</text>

    <circle cx="505" cy="260" r="120" fill="#3d78b5"/>
    <text x="505" y="245" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">Schema</text>
    <text x="505" y="285" text-anchor="middle" fill="#dfeaff" font-size="18">and tables</text>

    <circle cx="760" cy="450" r="120" fill="#1d8a9e"/>
    <text x="760" y="435" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="700">Profile</text>
    <text x="760" y="475" text-anchor="middle" fill="#d8f7f6" font-size="18">quality checks</text>

    <circle cx="1015" cy="260" r="120" fill="#d97742"/>
    <text x="1015" y="245" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="700">Visualize</text>
    <text x="1015" y="285" text-anchor="middle" fill="#fbe7d9" font-size="18">patterns</text>

    <circle cx="1270" cy="450" r="120" fill="#2d7d6f"/>
    <text x="1270" y="435" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="700">Decide</text>
    <text x="1270" y="475" text-anchor="middle" fill="#dff5f0" font-size="18">and validate</text>

    <path d="M380 370 L455 300" stroke="#384b66" stroke-width="10" fill="none" marker-end="url(#arrow)"/>
    <path d="M625 300 L690 370" stroke="#384b66" stroke-width="10" fill="none" marker-end="url(#arrow)"/>
    <path d="M880 370 L955 300" stroke="#384b66" stroke-width="10" fill="none" marker-end="url(#arrow)"/>
    <path d="M1145 300 L1210 370" stroke="#384b66" stroke-width="10" fill="none" marker-end="url(#arrow)"/>
    <path d="M1270 570 C1270 680 1100 700 990 710 C700 720 390 700 300 620" stroke="#384b66" stroke-width="10" fill="none" marker-end="url(#arrow)"/>

    <rect x="530" y="620" width="540" height="110" rx="18" fill="#ffffff" opacity="0.9"/>
    <text x="800" y="665" text-anchor="middle" fill="#1f2937" font-size="34" font-weight="700">From question to validated insight</text>
    <text x="800" y="700" text-anchor="middle" fill="#4b5563" font-size="22">Repeat the loop with clearer checks and better segment logic.</text>
  </g>
</svg>
