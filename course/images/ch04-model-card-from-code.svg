<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Generating a Model Card from code, schema, and metrics files with Copilot">
  <!-- Left Column: Source Files -->
  <rect x="50" y="50" width="460" height="640" rx="24" fill="#FFFFFF" stroke="#312E81" stroke-width="4"/>
  <text x="280" y="125" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">ATTACHED CONTEXT FILES</text>

  <rect x="85" y="170" width="390" height="140" rx="14" fill="#EEF2FF" stroke="#312E81" stroke-width="3"/>
  <text x="280" y="230" text-anchor="middle" fill="#0E7490" font-family="Courier New, monospace" font-size="25" font-weight="700">#file schema.md</text>
  <text x="280" y="275" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="22">Feature definitions and target</text>

  <rect x="85" y="340" width="390" height="140" rx="14" fill="#EEF2FF" stroke="#312E81" stroke-width="3"/>
  <text x="280" y="400" text-anchor="middle" fill="#0E7490" font-family="Courier New, monospace" font-size="25" font-weight="700">#file train_baseline.py</text>
  <text x="280" y="445" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="22">Pipeline steps and split dates</text>

  <rect x="85" y="510" width="390" height="140" rx="14" fill="#EEF2FF" stroke="#312E81" stroke-width="3"/>
  <text x="280" y="570" text-anchor="middle" fill="#0E7490" font-family="Courier New, monospace" font-size="25" font-weight="700">#file metrics_output.json</text>
  <text x="280" y="615" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="22">Actual ROC AUC, KS, row counts</text>

  <!-- Arrow -->
  <path d="M530 370 H595" stroke="#1E2A6B" stroke-width="10" fill="none"/>
  <polygon points="620,370 590,350 590,390" fill="#1E2A6B"/>

  <!-- Right Area: Model Card Sections -->
  <rect x="640" y="50" width="910" height="640" rx="24" fill="#ECFEFF" stroke="#0E7490" stroke-width="4"/>
  <text x="1095" y="125" text-anchor="middle" fill="#0E7490" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">GENERATED MODEL_CARD.md</text>

  <!-- Sub-box 1: Grounded from files -->
  <rect x="675" y="170" width="410" height="480" rx="16" fill="#FFFFFF" stroke="#0E7490" stroke-width="3"/>
  <text x="880" y="230" text-anchor="middle" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Auto-Populated from Code</text>
  <text x="705" y="295" fill="#164E63" font-family="Arial, Helvetica, sans-serif" font-size="24">- Estimator and settings</text>
  <text x="705" y="355" fill="#164E63" font-family="Arial, Helvetica, sans-serif" font-size="24">- Input features and types</text>
  <text x="705" y="415" fill="#164E63" font-family="Arial, Helvetica, sans-serif" font-size="24">- Imputation and scaling</text>
  <text x="705" y="475" fill="#164E63" font-family="Arial, Helvetica, sans-serif" font-size="24">- Train and test windows</text>
  <text x="705" y="535" fill="#164E63" font-family="Arial, Helvetica, sans-serif" font-size="24">- Holdout AUC and KS</text>

  <!-- Sub-box 2: Marked TODO for Human -->
  <rect x="1110" y="170" width="405" height="480" rx="16" fill="#FFFBEB" stroke="#92400E" stroke-width="3"/>
  <text x="1312" y="230" text-anchor="middle" fill="#92400E" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Marked TODO for Human</text>
  <text x="1140" y="295" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="24">- Approved score cutoff</text>
  <text x="1140" y="355" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="24">- Business policy exceptions</text>
  <text x="1140" y="415" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="24">- Fair lending sign-off</text>
  <text x="1140" y="475" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="24">- Monitoring alert owners</text>
  <text x="1140" y="545" fill="#92400E" font-family="Courier New, monospace" font-size="22">TODO: Human sign-off</text>

  <!-- Footer -->
  <rect x="50" y="730" width="1500" height="115" rx="18" fill="#FFFFFF" stroke="#1E2A6B" stroke-width="4"/>
  <text x="800" y="800" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Extract technical facts from files and mark policy choices TODO</text>
</svg>
