  <rect x="80" y="80" width="540" height="640" rx="20" fill="#1E2A6B"/>
  <text x="350" y="180" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Source inputs</text>
  <text x="350" y="300" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="24">baseline_pipeline.py</text>
