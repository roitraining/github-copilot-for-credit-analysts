  <rect x="800" y="80" width="720" height="640" rx="20" fill="#ffffff" stroke="#0E7490" stroke-width="5"/>
  <text x="1160" y="180" text-anchor="middle" fill="#155E75" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Model card sections</text>
  <text x="1160" y="290" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="24">intended use</text>
