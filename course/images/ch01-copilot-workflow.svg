<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Safe Copilot workflow">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f4f7fb"/>
      <stop offset="100%" stop-color="#e9eef7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4c66"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="120" y="350" width="210" height="140" rx="24" fill="#244d9a"/>
    <text x="225" y="400" text-anchor="middle" fill="#ffffff" font-size="38" font-weight="700">Discover</text>
    <text x="225" y="445" text-anchor="middle" fill="#dfe9ff" font-size="22">goal + policy</text>

    <rect x="410" y="350" width="210" height="140" rx="24" fill="#3a7ea1"/>
    <text x="515" y="400" text-anchor="middle" fill="#ffffff" font-size="38" font-weight="700">Scope</text>
    <text x="515" y="445" text-anchor="middle" fill="#d9f0fb" font-size="22">files + limits</text>

    <rect x="700" y="350" width="210" height="140" rx="24" fill="#4d6dd7"/>
    <text x="805" y="400" text-anchor="middle" fill="#ffffff" font-size="38" font-weight="700">Generate</text>
    <text x="805" y="445" text-anchor="middle" fill="#edf0ff" font-size="22">draft code</text>

    <rect x="990" y="350" width="210" height="140" rx="24" fill="#d97742"/>
    <text x="1095" y="400" text-anchor="middle" fill="#ffffff" font-size="38" font-weight="700">Validate</text>
    <text x="1095" y="445" text-anchor="middle" fill="#fdf0e5" font-size="22">tests + checks</text>

    <rect x="1280" y="350" width="210" height="140" rx="24" fill="#2d7d6f"/>
    <text x="1385" y="400" text-anchor="middle" fill="#ffffff" font-size="38" font-weight="700">Approve</text>
    <text x="1385" y="445" text-anchor="middle" fill="#dff5f0" font-size="22">reviewed output</text>

    <path d="M330 420 H410" stroke="#3d4c66" stroke-width="8" fill="none" marker-end="url(#arrow)"/>
    <path d="M620 420 H700" stroke="#3d4c66" stroke-width="8" fill="none" marker-end="url(#arrow)"/>
    <path d="M910 420 H990" stroke="#3d4c66" stroke-width="8" fill="none" marker-end="url(#arrow)"/>
    <path d="M1200 420 H1280" stroke="#3d4c66" stroke-width="8" fill="none" marker-end="url(#arrow)"/>

    <path d="M1385 490 V620 C1385 650 1365 670 1335 670 H265 C235 670 215 650 215 620 V490" fill="none" stroke="#3d4c66" stroke-width="8" stroke-dasharray="14 14" marker-end="url(#arrow)"/>

    <rect x="520" y="130" width="560" height="120" rx="18" fill="#ffffff" opacity="0.9"/>
    <text x="800" y="177" text-anchor="middle" fill="#1f2937" font-size="34" font-weight="700">Safe, reviewable AI delivery loop</text>
    <text x="800" y="215" text-anchor="middle" fill="#4b5563" font-size="22">Scope controls and tests keep the workflow trustworthy.</text>
  </g>
</svg>
