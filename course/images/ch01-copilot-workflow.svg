<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Safe Copilot workflow steps">
  <rect width="1600" height="900" fill="#F4F6FB"/>
  <rect x="80" y="280" width="240" height="200" rx="24" fill="#1E2A6B"/>
  <text x="200" y="360" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Discover</text>
  <text x="200" y="420" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="22">goal + policy</text>
  <rect x="380" y="280" width="240" height="200" rx="24" fill="#4F46E5"/>
  <text x="500" y="360" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Scope</text>
  <text x="500" y="420" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="22">files + limits</text>
  <rect x="680" y="280" width="240" height="200" rx="24" fill="#6366F1"/>
  <text x="800" y="360" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Generate</text>
  <text x="800" y="420" text-anchor="middle" fill="#EEF2FF" font-family="Arial, Helvetica, sans-serif" font-size="22">draft code</text>
  <rect x="980" y="280" width="240" height="200" rx="24" fill="#7C3AED"/>
  <text x="1100" y="360" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Validate</text>
  <text x="1100" y="420" text-anchor="middle" fill="#F5F3FF" font-family="Arial, Helvetica, sans-serif" font-size="22">tests + checks</text>
  <rect x="1280" y="280" width="240" height="200" rx="24" fill="#0E7490"/>
  <text x="1400" y="360" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Approve</text>
  <text x="1400" y="420" text-anchor="middle" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="22">reviewed output</text>
  <path d="M320 380 H380" stroke="#4338CA" stroke-width="8" fill="none"/>
  <path d="M620 380 H680" stroke="#4338CA" stroke-width="8" fill="none"/>
  <path d="M920 380 H980" stroke="#4338CA" stroke-width="8" fill="none"/>
  <path d="M1220 380 H1280" stroke="#4338CA" stroke-width="8" fill="none"/>
  <path d="M1400 480 V640 C1400 680 1360 720 1320 720 H280 C240 720 200 680 200 640 V480" fill="none" stroke="#4338CA" stroke-width="8" stroke-dasharray="14 14"/>
  <text x="800" y="800" text-anchor="middle" fill="#4C4668" font-family="Arial, Helvetica, sans-serif" font-size="24">Scope controls and tests keep the loop trustworthy</text>
</svg>