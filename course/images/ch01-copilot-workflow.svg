<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Safe Copilot workflow steps">
  <rect width="1600" height="900" fill="#f4f7fb"/>
  <rect x="80" y="280" width="240" height="200" rx="24" fill="#244d9a"/>
  <text x="200" y="360" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Discover</text>
  <text x="200" y="420" text-anchor="middle" fill="#dfe9ff" font-family="Arial, Helvetica, sans-serif" font-size="22">goal + policy</text>
  <rect x="380" y="280" width="240" height="200" rx="24" fill="#3a7ea1"/>
  <text x="500" y="360" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Scope</text>
  <text x="500" y="420" text-anchor="middle" fill="#d9f0fb" font-family="Arial, Helvetica, sans-serif" font-size="22">files + limits</text>
  <rect x="680" y="280" width="240" height="200" rx="24" fill="#4d6dd7"/>
  <text x="800" y="360" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Generate</text>
  <text x="800" y="420" text-anchor="middle" fill="#edf0ff" font-family="Arial, Helvetica, sans-serif" font-size="22">draft code</text>
  <rect x="980" y="280" width="240" height="200" rx="24" fill="#d97742"/>
  <text x="1100" y="360" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Validate</text>
  <text x="1100" y="420" text-anchor="middle" fill="#fdf0e5" font-family="Arial, Helvetica, sans-serif" font-size="22">tests + checks</text>
  <rect x="1280" y="280" width="240" height="200" rx="24" fill="#2d7d6f"/>
  <text x="1400" y="360" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Approve</text>
  <text x="1400" y="420" text-anchor="middle" fill="#dff5f0" font-family="Arial, Helvetica, sans-serif" font-size="22">reviewed output</text>
  <path d="M320 380 H380" stroke="#3d4c66" stroke-width="8" fill="none"/>
  <path d="M620 380 H680" stroke="#3d4c66" stroke-width="8" fill="none"/>
  <path d="M920 380 H980" stroke="#3d4c66" stroke-width="8" fill="none"/>
  <path d="M1220 380 H1280" stroke="#3d4c66" stroke-width="8" fill="none"/>
  <path d="M1400 480 V640 C1400 680 1360 720 1320 720 H280 C240 720 200 680 200 640 V480" fill="none" stroke="#3d4c66" stroke-width="8" stroke-dasharray="14 14"/>
  <text x="800" y="800" text-anchor="middle" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="24">Scope controls and tests keep the loop trustworthy</text>
</svg>