<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-label="Attach SQL schema before asking Copilot for queries">
  <!-- Left Input Stack -->
  <rect x="60" y="60" width="440" height="530" rx="24" fill="#FFFFFF" stroke="#1E2A6B" stroke-width="4"/>
  <text x="280" y="130" text-anchor="middle" fill="#1E2A6B" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">1. ATTACH CONTEXT</text>
  <rect x="95" y="165" width="370" height="120" rx="14" fill="#EEF2FF" stroke="#312E81" stroke-width="3"/>
  <text x="280" y="215" text-anchor="middle" fill="#1E1B4B" font-family="Courier New, monospace" font-size="28" font-weight="700">#file schema.sql</text>
  <text x="280" y="255" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="24">Table and column names</text>

  <rect x="95" y="310" width="370" height="110" rx="14" fill="#EEF2FF" stroke="#312E81" stroke-width="3"/>
  <text x="280" y="355" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">SQL Dialect</text>
  <text x="280" y="395" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="24">PostgreSQL, Snowflake, Spark</text>

  <rect x="95" y="445" width="370" height="110" rx="14" fill="#EEF2FF" stroke="#312E81" stroke-width="3"/>
  <text x="280" y="490" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Grouping and Filters</text>
  <text x="280" y="530" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="24">Exact rules in plain English</text>

  <!-- Arrow 1 -->
  <path d="M520 325 H590" stroke="#1E2A6B" stroke-width="10" fill="none"/>
  <polygon points="615,325 585,305 585,345" fill="#1E2A6B"/>

  <!-- Middle Box: Copilot Chat -->
  <rect x="635" y="135" width="350" height="380" rx="24" fill="#EEF2FF" stroke="#4F46E5" stroke-width="4"/>
  <text x="810" y="220" text-anchor="middle" fill="#4338CA" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">2. COPILOT CHAT</text>
  <text x="810" y="295" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Reads DDL</text>
  <text x="810" y="355" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="32">Matches join keys</text>
  <text x="810" y="415" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="32">Applies dialect syntax</text>

  <!-- Arrow 2 -->
  <path d="M1005 325 H1075" stroke="#1E2A6B" stroke-width="10" fill="none"/>
  <polygon points="1100,325 1070,305 1070,345" fill="#1E2A6B"/>

  <!-- Right Output Box -->
  <rect x="1120" y="60" width="420" height="530" rx="24" fill="#ECFEFF" stroke="#0E7490" stroke-width="4"/>
  <text x="1330" y="130" text-anchor="middle" fill="#0E7490" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">3. GENERATED SQL</text>
  <rect x="1155" y="170" width="350" height="380" rx="16" fill="#FFFFFF" stroke="#155E75" stroke-width="3"/>
  <text x="1180" y="230" fill="#0E7490" font-family="Courier New, monospace" font-size="24">WITH monthly AS (</text>
  <text x="1180" y="270" fill="#164E63" font-family="Courier New, monospace" font-size="24">  SELECT risk_band,</text>
  <text x="1180" y="310" fill="#164E63" font-family="Courier New, monospace" font-size="24">    AVG(dlq_30)...</text>
  <text x="1180" y="350" fill="#0E7490" font-family="Courier New, monospace" font-size="24">)</text>
  <text x="1330" y="435" text-anchor="middle" fill="#155E75" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Real column names</text>
  <text x="1330" y="480" text-anchor="middle" fill="#155E75" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Ready to run and test</text>
</svg>
