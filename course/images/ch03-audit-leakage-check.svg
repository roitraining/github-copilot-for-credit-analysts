<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="Using /explain to catch data leakage in Copilot-generated model code">
  <!-- Top: Leaky Code -->
  <rect x="40" y="40" width="720" height="290" rx="20" fill="#FEF2F2" stroke="#DC2626" stroke-width="4"/>
  <rect x="44" y="44" width="712" height="54" rx="16" fill="#FEE2E2"/>
  <text x="400" y="78" text-anchor="middle" fill="#B91C1C" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">COMMON AI BUG: FIT ON WHOLE DATASET</text>
  <text x="70" y="145" fill="#991B1B" font-family="Courier New, monospace" font-size="20"># Scales before splitting (leaks test stats)</text>
  <text x="70" y="185" fill="#7F1D1D" font-family="Courier New, monospace" font-size="21">X_scaled = scaler.fit_transform(df[features])</text>
  <text x="70" y="225" fill="#7F1D1D" font-family="Courier New, monospace" font-size="21">X_tr, X_te, y_tr, y_te = train_test_split(</text>
  <text x="70" y="265" fill="#7F1D1D" font-family="Courier New, monospace" font-size="21">    X_scaled, df["default_60d"]</text>
  <text x="70" y="305" fill="#7F1D1D" font-family="Courier New, monospace" font-size="21">)</text>

  <!-- Middle: Audit Prompt -->
  <rect x="65" y="365" width="670" height="115" rx="16" fill="#EEF2FF" stroke="#4F46E5" stroke-width="3"/>
  <text x="400" y="410" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Select code and ask in Copilot Chat:</text>
  <text x="400" y="452" text-anchor="middle" fill="#1E1B4B" font-family="Courier New, monospace" font-size="20">"/explain Check for preprocessing leakage"</text>

  <!-- Bottom: Fixed Pipeline -->
  <rect x="40" y="515" width="720" height="245" rx="20" fill="#F0FDFA" stroke="#0F766E" stroke-width="4"/>
  <rect x="44" y="519" width="712" height="54" rx="16" fill="#ECFDF5"/>
  <text x="400" y="553" text-anchor="middle" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">FIXED WITH /fix: PIPELINE FITS ON TRAIN ONLY</text>
  <text x="70" y="618" fill="#047857" font-family="Courier New, monospace" font-size="21">pipe = Pipeline([("scaler", StandardScaler()),</text>
  <text x="70" y="655" fill="#047857" font-family="Courier New, monospace" font-size="21">                 ("clf", LogisticRegression())])</text>
  <text x="70" y="695" fill="#134E4A" font-family="Courier New, monospace" font-size="21">pipe.fit(X_train, y_train)</text>
  <text x="70" y="732" fill="#134E4A" font-family="Courier New, monospace" font-size="21">probs = pipe.predict_proba(X_test)[:, 1]</text>
</svg>
