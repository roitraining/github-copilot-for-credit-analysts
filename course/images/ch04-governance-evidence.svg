<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Governance evidence chain">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#F4F6FB"/>
      <stop offset="100%" stop-color="#ECFEFF"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#312E81"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="110" y="330" width="210" height="180" rx="22" fill="#1E2A6B"/>
    <text x="215" y="395" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">Prompt</text>
    <text x="215" y="435" text-anchor="middle" fill="#E0E7FF" font-size="20">intent + scope</text>

    <rect x="420" y="330" width="210" height="180" rx="22" fill="#4F46E5"/>
    <text x="525" y="395" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">Diff</text>
    <text x="525" y="435" text-anchor="middle" fill="#E0E7FF" font-size="20">changed files</text>

    <rect x="730" y="330" width="210" height="180" rx="22" fill="#6366F1"/>
    <text x="835" y="395" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">Tests</text>
    <text x="835" y="435" text-anchor="middle" fill="#CFFAFE" font-size="20">results + checks</text>

    <rect x="1040" y="330" width="210" height="180" rx="22" fill="#7C3AED"/>
    <text x="1145" y="395" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">Approval</text>
    <text x="1145" y="435" text-anchor="middle" fill="#EDE9FE" font-size="20">review + rationale</text>

    <rect x="1350" y="330" width="170" height="180" rx="22" fill="#0E7490"/>
    <text x="1435" y="395" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">Audit</text>
    <text x="1435" y="435" text-anchor="middle" fill="#CFFAFE" font-size="20">evidence trail</text>

    <path d="M320 420 H420" stroke="#312E81" stroke-width="10" fill="none" marker-end="url(#arrow)"/>
    <path d="M630 420 H730" stroke="#312E81" stroke-width="10" fill="none" marker-end="url(#arrow)"/>
    <path d="M940 420 H1040" stroke="#312E81" stroke-width="10" fill="none" marker-end="url(#arrow)"/>
    <path d="M1250 420 H1350" stroke="#312E81" stroke-width="10" fill="none" marker-end="url(#arrow)"/>

    <rect x="430" y="640" width="720" height="90" rx="18" fill="#ffffff" opacity="0.92"/>
    <text x="790" y="697" text-anchor="middle" fill="#1E1B4B" font-size="33" font-weight="700">Governance is a chain of evidence, not a final opinion.</text>
  </g>
</svg>
