<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Governance evidence chain">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#edf5f1"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f3d56"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="110" y="330" width="210" height="180" rx="22" fill="#224d9a"/>
    <text x="215" y="395" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">Prompt</text>
    <text x="215" y="435" text-anchor="middle" fill="#dfe9ff" font-size="20">intent + scope</text>

    <rect x="420" y="330" width="210" height="180" rx="22" fill="#3d78b5"/>
    <text x="525" y="395" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">Diff</text>
    <text x="525" y="435" text-anchor="middle" fill="#dfeaff" font-size="20">changed files</text>

    <rect x="730" y="330" width="210" height="180" rx="22" fill="#1d8a9e"/>
    <text x="835" y="395" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">Tests</text>
    <text x="835" y="435" text-anchor="middle" fill="#d9f6f8" font-size="20">results + checks</text>

    <rect x="1040" y="330" width="210" height="180" rx="22" fill="#d97742"/>
    <text x="1145" y="395" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">Approval</text>
    <text x="1145" y="435" text-anchor="middle" fill="#fbe7d9" font-size="20">review + rationale</text>

    <rect x="1350" y="330" width="170" height="180" rx="22" fill="#2d7d6f"/>
    <text x="1435" y="395" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">Audit</text>
    <text x="1435" y="435" text-anchor="middle" fill="#dff5f0" font-size="20">evidence trail</text>

    <path d="M320 420 H420" stroke="#2f3d56" stroke-width="10" fill="none" marker-end="url(#arrow)"/>
    <path d="M630 420 H730" stroke="#2f3d56" stroke-width="10" fill="none" marker-end="url(#arrow)"/>
    <path d="M940 420 H1040" stroke="#2f3d56" stroke-width="10" fill="none" marker-end="url(#arrow)"/>
    <path d="M1250 420 H1350" stroke="#2f3d56" stroke-width="10" fill="none" marker-end="url(#arrow)"/>

    <rect x="430" y="640" width="720" height="90" rx="18" fill="#ffffff" opacity="0.92"/>
    <text x="790" y="697" text-anchor="middle" fill="#1f2937" font-size="33" font-weight="700">Governance is a chain of evidence, not a final opinion.</text>
  </g>
</svg>
