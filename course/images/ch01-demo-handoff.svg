<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Demo path web to VS Code">
  <rect width="1600" height="900" fill="#F4F6FB"/>

  <rect x="40" y="80" width="350" height="520" rx="22" fill="#1E2A6B"/>
  <text x="215" y="160" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">1. Web</text>
  <text x="215" y="280" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="22">Ask about Chat</text>
  <text x="215" y="330" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="22">vs inline</text>
  <text x="215" y="450" text-anchor="middle" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="20">Orientation only</text>

  <path d="M405 340 H445" stroke="#312E81" stroke-width="8" fill="none"/>
  <polygon points="465,340 440,322 440,358" fill="#312E81"/>

  <rect x="480" y="80" width="350" height="520" rx="22" fill="#4F46E5"/>
  <text x="655" y="160" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">2. VS Code Chat</text>
  <text x="655" y="280" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="22">Ask the same</text>
  <text x="655" y="330" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="22">question again</text>
  <text x="655" y="450" text-anchor="middle" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="20">Compare answers</text>

  <path d="M845 340 H885" stroke="#312E81" stroke-width="8" fill="none"/>
  <polygon points="905,340 880,322 880,358" fill="#312E81"/>

  <rect x="920" y="80" width="350" height="520" rx="22" fill="#7C3AED"/>
  <text x="1095" y="160" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">3. Inline</text>
  <text x="1095" y="280" text-anchor="middle" fill="#EDE9FE" font-family="Arial, Helvetica, sans-serif" font-size="22">Type def add(a, b):</text>
  <text x="1095" y="330" text-anchor="middle" fill="#EDE9FE" font-family="Arial, Helvetica, sans-serif" font-size="22">and pause</text>
  <text x="1095" y="450" text-anchor="middle" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="20">Ghost text appears</text>

  <path d="M1285 340 H1325" stroke="#312E81" stroke-width="8" fill="none"/>
  <polygon points="1345,340 1320,322 1320,358" fill="#312E81"/>

  <rect x="1360" y="80" width="200" height="520" rx="22" fill="#0E7490"/>
  <text x="1460" y="200" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">4. Decide</text>
  <text x="1460" y="320" text-anchor="middle" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="20">Accept</text>
  <text x="1460" y="370" text-anchor="middle" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="20">or</text>
  <text x="1460" y="420" text-anchor="middle" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="20">reject</text>
  <text x="1460" y="520" text-anchor="middle" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="18">You stay in control</text>

  <rect x="140" y="660" width="1320" height="160" rx="20" fill="#ffffff" stroke="#1E2A6B" stroke-width="4"/>
  <text x="800" y="730" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Same question, two surfaces</text>
  <text x="800" y="785" text-anchor="middle" fill="#4C4668" font-family="Arial, Helvetica, sans-serif" font-size="22">Web orients you. VS Code is where you accept, reject, and edit code.</text>
</svg>