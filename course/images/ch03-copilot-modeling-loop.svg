<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Analyst Copilot reviewer roles">
  <rect width="1600" height="900" fill="#F4F6FB"/>
  <rect x="80" y="120" width="440" height="520" rx="24" fill="#1E2A6B"/>
  <text x="300" y="230" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Analyst</text>
  <text x="300" y="330" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="24">sets target and policy</text>
  <text x="300" y="390" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="24">defines leakage wall</text>
  <text x="300" y="450" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="24">names metrics</text>
  <text x="300" y="550" text-anchor="middle" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="22">Owns the problem</text>

  <rect x="580" y="120" width="440" height="520" rx="24" fill="#4F46E5"/>
  <text x="800" y="230" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Copilot</text>
  <text x="800" y="330" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="24">scaffolds pipeline code</text>
  <text x="800" y="390" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="24">drafts tests and tables</text>
  <text x="800" y="450" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="24">suggests refactors</text>
  <text x="800" y="550" text-anchor="middle" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="22">Accelerates typing</text>

  <rect x="1080" y="120" width="440" height="520" rx="24" fill="#0E7490"/>
  <text x="1300" y="230" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Reviewer</text>
  <text x="1300" y="330" text-anchor="middle" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="24">runs checks</text>
  <text x="1300" y="390" text-anchor="middle" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="24">audits assumptions</text>
  <text x="1300" y="450" text-anchor="middle" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="24">signs go / no-go</text>
  <text x="1300" y="550" text-anchor="middle" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="22">Owns the decision</text>

  <text x="800" y="760" text-anchor="middle" fill="#4C4668" font-family="Arial, Helvetica, sans-serif" font-size="26">We teach the middle and the handoffs - not credit theory</text>
</svg>