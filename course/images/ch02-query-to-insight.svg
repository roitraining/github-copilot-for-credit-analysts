<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="From business question to chart insight">
  <rect width="1600" height="900" fill="#F4F6FB"/>
  <rect x="60" y="100" width="350" height="600" rx="20" fill="#1E2A6B"/>
  <text x="235" y="220" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Question</text>
  <text x="235" y="330" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="22">Which risk bands</text>
  <text x="235" y="380" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="22">drove the rise in</text>
  <text x="235" y="430" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="22">30-day delinquency?</text>
  <text x="235" y="560" text-anchor="middle" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="20">Decision-shaped</text>

  <rect x="450" y="100" width="350" height="600" rx="20" fill="#4F46E5"/>
  <text x="625" y="220" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Contract</text>
  <text x="625" y="330" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="22">grain = month x band</text>
  <text x="625" y="380" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="22">denominator rules</text>
  <text x="625" y="430" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="22">metric definition file</text>
  <text x="625" y="560" text-anchor="middle" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="20">Bind before plotting</text>

  <rect x="840" y="100" width="350" height="600" rx="20" fill="#7C3AED"/>
  <text x="1015" y="220" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Plot prompt</text>
  <text x="1015" y="330" text-anchor="middle" fill="#EDE9FE" font-family="Arial, Helvetica, sans-serif" font-size="22">matplotlib / seaborn</text>
  <text x="1015" y="380" text-anchor="middle" fill="#EDE9FE" font-family="Arial, Helvetica, sans-serif" font-size="22">axis + legend rules</text>
  <text x="1015" y="430" text-anchor="middle" fill="#EDE9FE" font-family="Arial, Helvetica, sans-serif" font-size="22">interpretation bullets</text>
  <text x="1015" y="560" text-anchor="middle" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="20">Then visual QA</text>

  <rect x="1230" y="100" width="310" height="600" rx="20" fill="#0E7490"/>
  <text x="1385" y="220" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Insight</text>
  <text x="1385" y="330" text-anchor="middle" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="22">defensible claim</text>
  <text x="1385" y="380" text-anchor="middle" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="22">hypotheses next</text>
  <text x="1385" y="430" text-anchor="middle" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="22">checks to run</text>
  <text x="1385" y="560" text-anchor="middle" fill="#E9D5FF" font-family="Arial, Helvetica, sans-serif" font-size="20">Not decoration</text>

  <text x="800" y="820" text-anchor="middle" fill="#4C4668" font-family="Arial, Helvetica, sans-serif" font-size="24">If the question is fuzzy, Copilot will draw a confident wrong chart</text>
</svg>