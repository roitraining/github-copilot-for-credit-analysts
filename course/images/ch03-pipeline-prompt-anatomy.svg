<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="Five parts of a scikit-learn pipeline prompt in Copilot Chat">
  <rect width="800" height="800" fill="#F4F6FB"/>

  <!-- Header -->
  <rect x="40" y="35" width="720" height="85" rx="18" fill="#1E2A6B"/>
  <text x="400" y="88" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Anatomy of a Model Pipeline Prompt</text>

  <!-- Step 1 -->
  <rect x="50" y="145" width="700" height="100" rx="16" fill="#312E81"/>
  <rect x="75" y="168" width="165" height="54" rx="10" fill="#4F46E5"/>
  <text x="157" y="203" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">1. CONTEXT</text>
  <text x="260" y="190" fill="#FFFFFF" font-family="Courier New, monospace" font-size="22" font-weight="700">#file schema.md</text>
  <text x="260" y="222" fill="#C7D2FE" font-family="Arial, Helvetica, sans-serif" font-size="20">Exact feature list + target column</text>

  <!-- Step 2 -->
  <rect x="50" y="265" width="700" height="100" rx="16" fill="#3730A3"/>
  <rect x="75" y="288" width="165" height="54" rx="10" fill="#6366F1"/>
  <text x="157" y="323" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">2. SPLIT</text>
  <text x="260" y="310" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Explicit Split Rule</text>
  <text x="260" y="342" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="20">Filter by application_month (no random split)</text>

  <!-- Step 3 -->
  <rect x="50" y="385" width="700" height="100" rx="16" fill="#4F46E5"/>
  <rect x="75" y="408" width="165" height="54" rx="10" fill="#1E2A6B"/>
  <text x="157" y="443" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">3. PREP</text>
  <text x="260" y="430" fill="#FFFFFF" font-family="Courier New, monospace" font-size="22" font-weight="700">ColumnTransformer</text>
  <text x="260" y="462" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="20">Impute/scale numeric; encode categorical</text>

  <!-- Step 4 -->
  <rect x="50" y="505" width="700" height="100" rx="16" fill="#0E7490"/>
  <rect x="75" y="528" width="165" height="54" rx="10" fill="#155E75"/>
  <text x="157" y="563" text-anchor="middle" fill="#67E8F9" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">4. MODEL</text>
  <text x="260" y="550" fill="#FFFFFF" font-family="Courier New, monospace" font-size="22" font-weight="700">LogisticRegression</text>
  <text x="260" y="582" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="20">Wrap prep + estimator in Pipeline</text>

  <!-- Step 5 -->
  <rect x="50" y="625" width="700" height="130" rx="16" fill="#0F766E"/>
  <rect x="75" y="662" width="165" height="54" rx="10" fill="#115E59"/>
  <text x="157" y="697" text-anchor="middle" fill="#99F6E4" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">5. GUARD</text>
  <text x="260" y="675" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Forbidden Columns List</text>
  <text x="260" y="710" fill="#CCFBF1" font-family="Arial, Helvetica, sans-serif" font-size="20">Drop ID and post-decision columns</text>
</svg>
