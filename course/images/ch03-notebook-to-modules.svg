<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Notebook refactor into modules">
  <rect width="1600" height="900" fill="#F4F6FB"/>
  <rect x="60" y="80" width="380" height="640" rx="20" fill="#6366F1"/>
  <text x="250" y="160" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">notebook.ipynb</text>
  <rect x="100" y="220" width="300" height="55" rx="8" fill="#A5B4FC"/>
  <rect x="100" y="300" width="300" height="55" rx="8" fill="#A5B4FC"/>
  <rect x="100" y="380" width="300" height="55" rx="8" fill="#A5B4FC"/>
  <rect x="100" y="460" width="300" height="55" rx="8" fill="#A5B4FC"/>
  <rect x="100" y="540" width="300" height="55" rx="8" fill="#A5B4FC"/>
  <text x="250" y="660" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="34">mixed cells, hard to test</text>

  <path d="M470 400 H560" stroke="#312E81" stroke-width="12" fill="none"/>
  <polygon points="580,400 550,375 550,425" fill="#312E81"/>
  <text x="525" y="360" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="32">plan + approve</text>

  <rect x="600" y="100" width="300" height="140" rx="16" fill="#1E2A6B"/>
  <text x="750" y="160" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">features.py</text>
  <text x="750" y="205" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="32">step 1 + tests</text>

  <rect x="600" y="290" width="300" height="140" rx="16" fill="#4F46E5"/>
  <text x="750" y="350" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">pipeline.py</text>
  <text x="750" y="395" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="32">step 2 + tests</text>

  <rect x="600" y="480" width="300" height="140" rx="16" fill="#0E7490"/>
  <text x="750" y="540" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">validation.py</text>
  <text x="750" y="585" text-anchor="middle" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="32">step 3 + tests</text>

  <path d="M920 400 H1010" stroke="#312E81" stroke-width="12" fill="none"/>
  <polygon points="1030,400 1000,375 1000,425" fill="#312E81"/>

  <rect x="1050" y="160" width="480" height="460" rx="20" fill="#ffffff" stroke="#1E2A6B" stroke-width="5"/>
  <text x="1290" y="250" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">Each step returns</text>
  <text x="1290" y="340" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="36">diff summary</text>
  <text x="1290" y="410" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="36">pytest results</text>
  <text x="1290" y="480" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="36">parity checks</text>
  <text x="1290" y="560" text-anchor="middle" fill="#0E7490" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">then STOP for approval</text>
</svg>