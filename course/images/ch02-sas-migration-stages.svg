<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="SAS migration stages with gates">
  <rect width="1600" height="900" fill="#f5f7fb"/>
  <rect x="60" y="100" width="320" height="260" rx="20" fill="#1f4b99"/>
  <text x="220" y="200" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Interpret</text>
  <text x="220" y="260" text-anchor="middle" fill="#dfe9ff" font-family="Arial, Helvetica, sans-serif" font-size="22">/explain the block</text>
  <text x="220" y="305" text-anchor="middle" fill="#dfe9ff" font-family="Arial, Helvetica, sans-serif" font-size="22">no code yet</text>

  <rect x="430" y="100" width="320" height="260" rx="20" fill="#3a7ea1"/>
  <text x="590" y="200" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Translate</text>
  <text x="590" y="260" text-anchor="middle" fill="#dff2fb" font-family="Arial, Helvetica, sans-serif" font-size="22">one block only</text>
  <text x="590" y="305" text-anchor="middle" fill="#dff2fb" font-family="Arial, Helvetica, sans-serif" font-size="22">SQL or Python</text>

  <rect x="800" y="100" width="320" height="260" rx="20" fill="#d97742"/>
  <text x="960" y="200" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Reconcile</text>
  <text x="960" y="260" text-anchor="middle" fill="#fbe7d9" font-family="Arial, Helvetica, sans-serif" font-size="22">grain and totals</text>
  <text x="960" y="305" text-anchor="middle" fill="#fbe7d9" font-family="Arial, Helvetica, sans-serif" font-size="22">vs legacy</text>

  <rect x="1170" y="100" width="370" height="260" rx="20" fill="#2d7d6f"/>
  <text x="1355" y="200" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Approve</text>
  <text x="1355" y="260" text-anchor="middle" fill="#def5f1" font-family="Arial, Helvetica, sans-serif" font-size="22">semantics sign-off</text>
  <text x="1355" y="305" text-anchor="middle" fill="#def5f1" font-family="Arial, Helvetica, sans-serif" font-size="22">then next block</text>

  <path d="M380 230 H430" stroke="#334155" stroke-width="10" fill="none"/>
  <path d="M750 230 H800" stroke="#334155" stroke-width="10" fill="none"/>
  <path d="M1120 230 H1170" stroke="#334155" stroke-width="10" fill="none"/>

  <rect x="160" y="440" width="1280" height="380" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <text x="800" y="530" text-anchor="middle" fill="#1f2937" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Hard stop gates (do not skip)</text>
  <text x="800" y="620" text-anchor="middle" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="26">Gate 1: structural parity at output grain</text>
  <text x="800" y="690" text-anchor="middle" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="26">Gate 2: metric parity within tolerance</text>
  <text x="800" y="760" text-anchor="middle" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="26">Gate 3: reviewer confirms business meaning</text>
</svg>