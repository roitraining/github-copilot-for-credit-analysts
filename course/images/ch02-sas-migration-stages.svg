<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="SAS migration stages with gates">
  <rect width="1600" height="900" fill="#F4F6FB"/>
  <rect x="60" y="100" width="320" height="260" rx="20" fill="#1E2A6B"/>
  <text x="220" y="200" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Interpret</text>
  <text x="220" y="260" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="36">/explain the block</text>
  <text x="220" y="305" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="36">no code yet</text>

  <rect x="430" y="100" width="320" height="260" rx="20" fill="#4F46E5"/>
  <text x="590" y="200" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Translate</text>
  <text x="590" y="260" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="36">one block only</text>
  <text x="590" y="305" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="36">SQL or Python</text>

  <rect x="800" y="100" width="320" height="260" rx="20" fill="#7C3AED"/>
  <text x="960" y="200" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Reconcile</text>
  <text x="960" y="260" text-anchor="middle" fill="#EDE9FE" font-family="Arial, Helvetica, sans-serif" font-size="36">grain and totals</text>
  <text x="960" y="305" text-anchor="middle" fill="#EDE9FE" font-family="Arial, Helvetica, sans-serif" font-size="36">vs legacy</text>

  <rect x="1170" y="100" width="370" height="260" rx="20" fill="#0E7490"/>
  <text x="1355" y="200" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Approve</text>
  <text x="1355" y="260" text-anchor="middle" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="36">semantics sign-off</text>
  <text x="1355" y="305" text-anchor="middle" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="36">then next block</text>

  <path d="M380 230 H430" stroke="#312E81" stroke-width="10" fill="none"/>
  <path d="M750 230 H800" stroke="#312E81" stroke-width="10" fill="none"/>
  <path d="M1120 230 H1170" stroke="#312E81" stroke-width="10" fill="none"/>

  <rect x="160" y="440" width="1280" height="380" rx="22" fill="#ffffff" stroke="#A5B4FC" stroke-width="3"/>
  <text x="800" y="530" text-anchor="middle" fill="#1E1B4B" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Hard stop gates (do not skip)</text>
  <text x="800" y="620" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="38">Gate 1: structural parity at output grain</text>
  <text x="800" y="690" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="38">Gate 2: metric parity within tolerance</text>
  <text x="800" y="760" text-anchor="middle" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="38">Gate 3: reviewer confirms business meaning</text>
</svg>