<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Two timelines. Manual course creation runs much longer than the factory. Planning is about the same. Content creation and maintenance are much faster. Testing and editing are a little faster.">
  <defs>
    <filter id="soft" x="-8%" y="-12%" width="116%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#082445" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#f4f8fc"/>

  <text x="48" y="64" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="24">Lengths are relative time for the same course. Same color is the same step.</text>

  <!-- Row labels -->
  <text x="48" y="196" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.6">MANUAL</text>
  <text x="48" y="236" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700">By hand</text>

  <text x="48" y="430" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.6">FACTORY</text>
  <text x="48" y="470" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700">With the agent</text>

  <!-- Manual timeline. Weights 18 / 42 / 18 / 22. -->
  <rect x="340" y="168" width="1212" height="112" rx="18" fill="#e7eef6"/>
  <rect x="340" y="168" width="218" height="112" rx="16" fill="#1e71d6"/>
  <rect x="568" y="168" width="492" height="112" rx="16" fill="#082445"/>
  <rect x="1070" y="168" width="218" height="112" rx="16" fill="#6a55e4"/>
  <rect x="1298" y="168" width="254" height="112" rx="16" fill="#bd35c2"/>

  <text x="449" y="232" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Planning</text>
  <text x="814" y="232" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Content creation</text>
  <text x="1179" y="232" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Testing, editing</text>
  <text x="1425" y="232" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Maintenance</text>

  <!-- Factory timeline. Planning matches. Content and maintenance are much shorter. Testing and editing a little shorter. -->
  <rect x="340" y="400" width="1212" height="112" rx="18" fill="#e7eef6"/>
  <rect x="340" y="400" width="218" height="112" rx="16" fill="#1e71d6"/>
  <rect x="568" y="400" width="68" height="112" rx="16" fill="#082445"/>
  <rect x="646" y="400" width="128" height="112" rx="16" fill="#6a55e4"/>
  <rect x="784" y="400" width="40" height="112" rx="14" fill="#bd35c2"/>

  <text x="449" y="464" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Planning</text>
  <text x="856" y="464" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700">Time saved</text>

  <!-- Phase judgments -->
  <g filter="url(#soft)">
    <rect x="48" y="600" width="364" height="240" rx="18" fill="#ffffff" stroke="#e3eaf3"/>
    <rect x="72" y="600" width="316" height="8" fill="#1e71d6"/>
  </g>
  <text x="76" y="668" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">COURSE PLANNING</text>
  <text x="76" y="724" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700">About the same</text>
  <text x="76" y="776" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="20">You still set the audience,</text>
  <text x="76" y="806" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="20">the length, and the outline.</text>

  <g filter="url(#soft)">
    <rect x="428" y="600" width="364" height="240" rx="18" fill="#ffffff" stroke="#e3eaf3"/>
    <rect x="452" y="600" width="316" height="8" fill="#082445"/>
  </g>
  <text x="456" y="668" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">CONTENT CREATION</text>
  <text x="456" y="724" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700">Much faster</text>
  <text x="456" y="776" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="20">One brief drafts the slides</text>
  <text x="456" y="806" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="20">and the labs.</text>

  <g filter="url(#soft)">
    <rect x="808" y="600" width="364" height="240" rx="18" fill="#ffffff" stroke="#e3eaf3"/>
    <rect x="832" y="600" width="316" height="8" fill="#6a55e4"/>
  </g>
  <text x="836" y="668" fill="#6a55e4" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">TESTING, EDITING</text>
  <text x="836" y="724" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700">A little faster</text>
  <text x="836" y="776" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="20">You review a draft, then</text>
  <text x="836" y="806" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="20">adjust it.</text>

  <g filter="url(#soft)">
    <rect x="1188" y="600" width="364" height="240" rx="18" fill="#ffffff" stroke="#e3eaf3"/>
    <rect x="1212" y="600" width="316" height="8" fill="#bd35c2"/>
  </g>
  <text x="1216" y="668" fill="#bd35c2" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">MAINTENANCE</text>
  <text x="1216" y="724" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700">Much faster</text>
  <text x="1216" y="776" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="20">A new class or a fix</text>
  <text x="1216" y="806" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="20">starts with a prompt.</text>
</svg>
