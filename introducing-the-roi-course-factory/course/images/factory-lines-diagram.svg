<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Two assembly lines, slides and labs, finishing as one course an instructor presents">
  <defs>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e71d6"/>
      <stop offset="0.52" stop-color="#6a55e4"/>
      <stop offset="1" stop-color="#bd35c2"/>
    </linearGradient>
    <linearGradient id="slides" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e71d6"/>
      <stop offset="1" stop-color="#3d62e4"/>
    </linearGradient>
    <linearGradient id="labs" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6a55e4"/>
      <stop offset="1" stop-color="#bd35c2"/>
    </linearGradient>
    <linearGradient id="out" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e71d6"/>
      <stop offset="0.55" stop-color="#6a55e4"/>
      <stop offset="1" stop-color="#bd35c2"/>
    </linearGradient>
    <filter id="cardshadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#082445" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-slides" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e71d6"/>
    </marker>
    <marker id="arrow-labs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8d45d4"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f4f8fc"/>
  <rect width="1600" height="10" fill="url(#topbar)"/>

  <text x="64" y="78" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="700">Two assembly lines. One course.</text>
  <text x="64" y="118" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="22">Authors set the job. Agents draft. Editors finish. The instructor presents.</text>

  <!-- Authors -->
  <g filter="url(#cardshadow)">
    <rect x="48" y="168" width="250" height="640" rx="22" fill="#082445"/>
  </g>
  <text x="76" y="230" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="2">AUTHORS</text>
  <text x="76" y="286" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700">Set the job</text>
  <text x="76" y="360" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="20">Audience</text>
  <text x="76" y="408" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="20">Prerequisites</text>
  <text x="76" y="456" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="20">Course length</text>
  <text x="76" y="504" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="20">Approved outline</text>
  <text x="76" y="620" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="18">Both lines</text>
  <text x="76" y="650" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="18">start here</text>

  <!-- Branch from authors into the two lines -->
  <path d="M298 466 H328 V314 H364" fill="none" stroke="#1e71d6" stroke-width="3" marker-end="url(#arrow-slides)"/>
  <path d="M328 466 V618 H364" fill="none" stroke="#8d45d4" stroke-width="3" marker-end="url(#arrow-labs)"/>

  <!-- Slides line -->
  <text x="372" y="196" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5">SLIDES LINE</text>

  <g filter="url(#cardshadow)">
    <rect x="372" y="214" width="248" height="200" rx="18" fill="#ffffff" stroke="#e3eaf3"/>
    <rect x="390" y="214" width="212" height="8" fill="url(#slides)"/>
  </g>
  <text x="396" y="268" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">AGENT</text>
  <text x="396" y="308" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700">Course skill</text>
  <text x="396" y="352" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="18">Drafts the deck</text>

  <line x1="620" y1="314" x2="668" y2="314" stroke="#1e71d6" stroke-width="3" marker-end="url(#arrow-slides)"/>

  <g filter="url(#cardshadow)">
    <rect x="680" y="214" width="248" height="200" rx="18" fill="#ffffff" stroke="#e3eaf3"/>
    <rect x="698" y="214" width="212" height="8" fill="url(#slides)"/>
  </g>
  <text x="704" y="268" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">EDITOR</text>
  <text x="704" y="308" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700">Local clone</text>
  <text x="704" y="352" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="18">Layout and images</text>

  <line x1="928" y1="314" x2="976" y2="314" stroke="#1e71d6" stroke-width="3" marker-end="url(#arrow-slides)"/>

  <g filter="url(#cardshadow)">
    <rect x="988" y="214" width="248" height="200" rx="18" fill="#ffffff" stroke="#e3eaf3"/>
    <rect x="1006" y="214" width="212" height="8" fill="url(#slides)"/>
  </g>
  <text x="1012" y="268" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">CHECK</text>
  <text x="1012" y="308" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700">Slides viewer</text>
  <text x="1012" y="352" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="18">What the room sees</text>

  <!-- Labs line -->
  <text x="372" y="500" fill="#8d45d4" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5">LABS LINE</text>

  <g filter="url(#cardshadow)">
    <rect x="372" y="518" width="248" height="200" rx="18" fill="#ffffff" stroke="#e3eaf3"/>
    <rect x="390" y="518" width="212" height="8" fill="url(#labs)"/>
  </g>
  <text x="396" y="572" fill="#8d45d4" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">AGENT</text>
  <text x="396" y="612" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700">Lab skill</text>
  <text x="396" y="656" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="18">Drafts the manual</text>

  <line x1="620" y1="618" x2="668" y2="618" stroke="#8d45d4" stroke-width="3" marker-end="url(#arrow-labs)"/>

  <g filter="url(#cardshadow)">
    <rect x="680" y="518" width="248" height="200" rx="18" fill="#ffffff" stroke="#e3eaf3"/>
    <rect x="698" y="518" width="212" height="8" fill="url(#labs)"/>
  </g>
  <text x="704" y="572" fill="#8d45d4" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">EDITOR</text>
  <text x="704" y="612" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700">Local clone</text>
  <text x="704" y="656" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="18">Steps and checks</text>

  <line x1="928" y1="618" x2="976" y2="618" stroke="#8d45d4" stroke-width="3" marker-end="url(#arrow-labs)"/>

  <g filter="url(#cardshadow)">
    <rect x="988" y="518" width="248" height="200" rx="18" fill="#ffffff" stroke="#e3eaf3"/>
    <rect x="1006" y="518" width="212" height="8" fill="url(#labs)"/>
  </g>
  <text x="1012" y="572" fill="#8d45d4" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">CHECK</text>
  <text x="1012" y="612" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700">Lab viewer</text>
  <text x="1012" y="656" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="18">What students follow</text>

  <!-- Merge into one course -->
  <path d="M1236 314 H1272 V440" fill="none" stroke="#1e71d6" stroke-width="3"/>
  <path d="M1236 618 H1272 V470" fill="none" stroke="#8d45d4" stroke-width="3"/>
  <path d="M1272 455 H1296" fill="none" stroke="#6a55e4" stroke-width="3" marker-end="url(#arrow-labs)"/>

  <g filter="url(#cardshadow)">
    <rect x="1304" y="250" width="252" height="400" rx="22" fill="url(#out)"/>
  </g>
  <text x="1332" y="330" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="1.6">INSTRUCTOR</text>
  <text x="1332" y="390" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700">One course</text>
  <text x="1332" y="470" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="20">Presents the class</text>
  <text x="1332" y="518" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="20">Slides on the stage</text>
  <text x="1332" y="566" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="20">Labs in hand</text>
</svg>
