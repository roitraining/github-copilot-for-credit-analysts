<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #f3f7ff 0%, #eaf8ef 100%);
        color: #1f2937;
      }
      .card {
        width: min(90vw, 520px);
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
        padding: 32px 28px;
        text-align: center;
      }
      h1 {
        margin: 0 0 18px;
        font-size: clamp(1.8rem, 4vw, 2.5rem);
      }
      .badge {
        display: inline-block;
        background: #dcfce7;
        color: #166534;
        font-weight: 700;
        border-radius: 999px;
        padding: 8px 14px;
        margin-bottom: 24px;
        font-size: 0.9rem;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 20px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      button:hover {
        background: #1d4ed8;
      }
      #output {
        margin-top: 20px;
        min-height: 24px;
        font-size: 1rem;
        color: #374151;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Hello World - Ready for Credit Analytics!</h1>
      <div class="badge">VS Code + GitHub Copilot + Browser Verified</div>
      <button id="runCheck">Run Quick Check</button>
      <div id="output" aria-live="polite"></div>
    </div>

    <script>
      document.getElementById('runCheck').addEventListener('click', function () {
        const now = new Date();
        const formatted = now.toLocaleString();
        document.getElementById('output').textContent = 'Current date and time: ' + formatted;
      });
    </script>
  </body>
</html>
