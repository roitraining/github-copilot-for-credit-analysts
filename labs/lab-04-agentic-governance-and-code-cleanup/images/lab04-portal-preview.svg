<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Preview of the MRM Governance and Model Card Portal web page">
  <rect width="1200" height="600" fill="#F8FAFC"/>
  <rect x="30" y="20" width="1140" height="560" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>

  <!-- Top Header -->
  <rect x="30" y="20" width="1140" height="68" rx="18" fill="#1E2A6B"/>
  <text x="65" y="63" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Model Risk Management (MRM) Governance Portal (governance_portal.html)</text>

  <!-- Status Badges -->
  <rect x="60" y="110" width="340" height="85" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="85" y="142" fill="#065F46" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Pytest Verification Suite</text>
  <text x="85" y="176" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">8 / 8 Passed (100%)</text>

  <rect x="430" y="110" width="340" height="85" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
  <text x="455" y="142" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Runtime Assertions Active</text>
  <text x="455" y="176" fill="#1E2A6B" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">4 Guards Verified</text>

  <rect x="800" y="110" width="340" height="85" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="825" y="142" fill="#92400E" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">MRM Approval Status</text>
  <text x="825" y="176" fill="#B45309" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">TODO: Human Sign-Off</text>

  <!-- Left Column: Model Card & Technical Spec -->
  <rect x="60" y="218" width="520" height="335" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <text x="85" y="254" fill="#1E293B" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Grounded Technical Specification</text>
  <text x="85" y="292" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17">- Module: src/rollup.py + src/validators.py</text>
  <text x="85" y="324" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17">- Grain: (perf_month, risk_band)</text>
  <text x="85" y="356" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17">- Denominator: status != 'charged_off' and dpd &lt;= 365</text>
  <text x="85" y="388" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17">- Guard 1: Missing required columns -> ValueError</text>
  <text x="85" y="420" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17">- Guard 2: Duplicate (account_id, perf_month) -> ValueError</text>
  <text x="85" y="452" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17">- Guard 3: Empty active denominator -> ValueError</text>
  <text x="85" y="484" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17">- Guard 4: Rate outside [0.0, 1.0] -> ValueError</text>

  <!-- Right Column: Interactive Sign-Off Checklist -->
  <rect x="610" y="218" width="530" height="335" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <text x="635" y="254" fill="#1E293B" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Human-in-the-Loop Sign-Off Checklist</text>
  <text x="635" y="295" fill="#047857" font-family="Courier New, monospace" font-size="17">[x] Formula parity verified against legacy script</text>
  <text x="635" y="330" fill="#047857" font-family="Courier New, monospace" font-size="17">[x] All 4 ValueError assertions covered by pytest</text>
  <text x="635" y="365" fill="#B45309" font-family="Courier New, monospace" font-size="17">[ ] TODO: Confirm quarterly alert threshold</text>
  <text x="635" y="400" fill="#B45309" font-family="Courier New, monospace" font-size="17">[ ] TODO: Model Risk Officer sign-off</text>
  <rect x="635" y="445" width="240" height="46" rx="8" fill="#0E7490"/>
  <text x="755" y="475" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Export Signed MRM JSON</text>
</svg>
