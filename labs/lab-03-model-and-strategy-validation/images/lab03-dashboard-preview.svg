<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Preview of the interactive Model Validation Dashboard web page">
  <rect width="1200" height="600" fill="#F8FAFC"/>
  <rect x="30" y="20" width="1140" height="560" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>

  <!-- Top Header -->
  <rect x="30" y="20" width="1140" height="68" rx="18" fill="#1E2A6B"/>
  <text x="65" y="63" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Credit Risk Model Validation Dashboard (validation_dashboard.html)</text>

  <!-- KPI Row -->
  <rect x="60" y="110" width="250" height="90" rx="12" fill="#EEF2FF" stroke="#818CF8" stroke-width="2"/>
  <text x="85" y="142" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Holdout ROC AUC</text>
  <text x="85" y="182" fill="#1E2A6B" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">0.764</text>

  <rect x="335" y="110" width="250" height="90" rx="12" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2"/>
  <text x="360" y="142" fill="#155E75" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Holdout KS Statistic</text>
  <text x="360" y="182" fill="#0E7490" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">0.392 (Decile 3)</text>

  <rect x="610" y="110" width="250" height="90" rx="12" fill="#ECFDF5" stroke="#34D399" stroke-width="2"/>
  <text x="635" y="142" fill="#065F46" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Top-2 Decile Capture</text>
  <text x="635" y="182" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">51.8% of Bads</text>

  <rect x="885" y="110" width="255" height="90" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="910" y="142" fill="#92400E" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Holdout Split Window</text>
  <text x="910" y="182" fill="#B45309" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">2025-10 to 2025-12</text>

  <!-- Left Panel: Cumulative Capture / KS Chart -->
  <rect x="60" y="225" width="510" height="325" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <text x="315" y="260" text-anchor="middle" fill="#1E293B" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Cumulative Bad vs Good Capture (KS Curve)</text>
  <polyline points="100,500 180,380 260,310 340,285 420,275 510,270" fill="none" stroke="#DC2626" stroke-width="4"/>
  <polyline points="100,500 180,460 260,420 340,375 420,325 510,270" fill="none" stroke="#4F46E5" stroke-width="4"/>
  <line x1="260" y1="310" x2="260" y2="420" stroke="#0F766E" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="275" y="368" fill="#0F766E" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Max KS = 0.392</text>

  <!-- Right Panel: 10-Bin Decile Table -->
  <rect x="600" y="225" width="540" height="325" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <text x="870" y="260" text-anchor="middle" fill="#1E293B" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Holdout Decile Capture Table (1 = Highest Risk)</text>
  <text x="625" y="302" fill="#1E2A6B" font-family="Courier New, monospace" font-size="16" font-weight="700">Decile | Count | Bads | Bad Rate | Pred Prob | Cum Capture</text>
  <text x="625" y="338" fill="#334155" font-family="Courier New, monospace" font-size="16">  1    |   30  |  11  |  36.7%   |   0.342   |    31.4%</text>
  <text x="625" y="368" fill="#334155" font-family="Courier New, monospace" font-size="16">  2    |   30  |   7  |  23.3%   |   0.228   |    51.4%</text>
  <text x="625" y="398" fill="#334155" font-family="Courier New, monospace" font-size="16">  3    |   30  |   6  |  20.0%   |   0.185   |    68.6%</text>
  <text x="625" y="428" fill="#334155" font-family="Courier New, monospace" font-size="16">  4    |   30  |   4  |  13.3%   |   0.134   |    80.0%</text>
  <text x="625" y="458" fill="#334155" font-family="Courier New, monospace" font-size="16">  5..10|  180  |   7  |   3.9%   |   0.045   |   100.0%</text>
  <text x="625" y="512" fill="#0F766E" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Grounded directly from metrics_output.json and decile_table.csv</text>
</svg>
