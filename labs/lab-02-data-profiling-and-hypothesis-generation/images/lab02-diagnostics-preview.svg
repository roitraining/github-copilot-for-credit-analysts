<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="2x2 portfolio diagnostic chart layout with threshold line and rotated labels">
  <rect width="1200" height="620" fill="#F8FAFC"/>
  <rect x="25" y="20" width="1150" height="580" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>

  <!-- Top left panel: Line trend -->
  <rect x="55" y="45" width="525" height="245" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="317" y="78" text-anchor="middle" fill="#1E293B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">30+ DPD Rate by Risk Band (Monthly Trend)</text>
  <polyline points="95,235 195,230 295,220 395,180 495,125" fill="none" stroke="#DC2626" stroke-width="4"/>
  <polyline points="95,245 195,242 295,238 395,235 495,232" fill="none" stroke="#4F46E5" stroke-width="4"/>
  <circle cx="495" cy="125" r="7" fill="#DC2626"/>
  <text x="415" y="112" fill="#991B1B" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Q4 Spike Annotated</text>

  <!-- Top right panel: Boxplot + Threshold line -->
  <rect x="620" y="45" width="525" height="245" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="882" y="78" text-anchor="middle" fill="#1E293B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Utilization Distribution by Risk Band</text>
  <line x1="655" y1="125" x2="1115" y2="125" stroke="#DC2626" stroke-width="3" stroke-dasharray="8,6"/>
  <text x="990" y="115" fill="#DC2626" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Threshold y=0.80</text>
  <rect x="700" y="185" width="70" height="55" fill="#818CF8" stroke="#312E81" stroke-width="2"/>
  <rect x="845" y="155" width="70" height="65" fill="#4F46E5" stroke="#312E81" stroke-width="2"/>
  <rect x="990" y="115" width="70" height="75" fill="#0E7490" stroke="#155E75" stroke-width="2"/>

  <!-- Bottom left panel: Vintage Cohort Heatmap -->
  <rect x="55" y="320" width="525" height="250" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="317" y="353" text-anchor="middle" fill="#1E293B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">30+ DPD Rate by Vintage and Risk Band</text>
  <rect x="120" y="380" width="120" height="50" fill="#E0E7FF"/>
  <rect x="250" y="380" width="120" height="50" fill="#C7D2FE"/>
  <rect x="380" y="380" width="120" height="50" fill="#818CF8"/>
  <rect x="120" y="440" width="120" height="50" fill="#C7D2FE"/>
  <rect x="250" y="440" width="120" height="50" fill="#818CF8"/>
  <rect x="380" y="440" width="120" height="50" fill="#F87171"/>
  <text x="440" y="472" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">14.2%</text>

  <!-- Bottom right panel: Active Account Volume -->
  <rect x="620" y="320" width="525" height="250" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="882" y="353" text-anchor="middle" fill="#1E293B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Active Account Volume by Risk Band</text>
  <rect x="700" y="405" width="75" height="125" fill="#1E2A6B"/>
  <rect x="845" y="430" width="75" height="100" fill="#4F46E5"/>
  <rect x="990" y="455" width="75" height="75" fill="#0E7490"/>
  <text x="737" y="395" text-anchor="middle" fill="#1E2A6B" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">210</text>
  <text x="882" y="420" text-anchor="middle" fill="#4F46E5" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">165</text>
  <text x="1027" y="445" text-anchor="middle" fill="#0E7490" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">110</text>
</svg>
