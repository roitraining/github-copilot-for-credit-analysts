  <text x="450" y="155" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Profile + SQL</text>
  <text x="450" y="215" text-anchor="middle" fill="#67E8F9" font-family="Courier New, monospace" font-size="18">profile_portfolio.py</text>
  <text x="450" y="275" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="20">Nulls, percentiles,</text>
