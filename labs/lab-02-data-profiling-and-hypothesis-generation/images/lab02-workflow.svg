<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Lab 2 workflow from schema.md to SAS translation and interactive charts">
  <rect width="1200" height="420" fill="#F4F6FB"/>

  <rect x="30" y="40" width="260" height="340" rx="20" fill="#1E2A6B"/>
