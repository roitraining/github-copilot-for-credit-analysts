  <text x="160" y="275" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="20">Generate 500-row</text>
  <text x="160" y="305" text-anchor="middle" fill="#E0E7FF" font-family="Arial, Helvetica, sans-serif" font-size="20">synthetic portfolio</text>

  <rect x="320" y="40" width="260" height="340" rx="20" fill="#312E81"/>
